name: Release binaries

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-tag:
    name: Verify tag and checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Verify semantic version tag on main
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
          TAG_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag '$TAG_NAME' is not a supported semantic version tag (expected vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-<pre-release>)." >&2
            exit 1
          fi

          git fetch origin main --force --no-tags
          if ! git merge-base --is-ancestor "$TAG_SHA" origin/main; then
            echo "Tag '$TAG_NAME' does not point to a commit reachable from main." >&2
            exit 1
          fi

          workspace_version="$(cargo metadata --no-deps --format-version 1 | python -c 'import json, sys; data = json.load(sys.stdin); print(next(package["version"] for package in data["packages"] if package["name"] == "vtest-cli"))')"
          tag_version="${TAG_NAME#v}"
          tag_base_version="${tag_version%%-*}"
          if [[ "$workspace_version" != "$tag_base_version" ]]; then
            echo "Tag version '$tag_base_version' does not match vtest-cli version '$workspace_version'." >&2
            exit 1
          fi

          echo "Validated $TAG_NAME ($TAG_SHA) for vtest-cli $workspace_version on main."
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run workspace tests
        run: cargo test --workspace --locked
      - name: Run clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run vtest doctor
        run: cargo run --quiet -p vtest-cli --locked -- doctor

  build:
    name: Build ${{ matrix.target }}
    needs: verify-tag
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build vtest
        run: cargo build --locked --release --package vtest-cli --target ${{ matrix.target }}
      - name: Package Unix binary
        if: matrix.os != 'windows-latest'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          archive="vtest-${VERSION}-${TARGET}.tar.gz"
          archive_path="${GITHUB_WORKSPACE}/dist/${archive}"
          tar -czf "$archive_path" -C "target/${TARGET}/release" vtest
          (
            cd "${GITHUB_WORKSPACE}/dist"
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$archive" > "${archive}.sha256"
            else
              shasum -a 256 "$archive" > "${archive}.sha256"
            fi
          )
      - name: Package Windows binary
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $archiveName = "vtest-$env:VERSION-$env:TARGET.zip"
          $archivePath = Join-Path $env:GITHUB_WORKSPACE "dist\$archiveName"
          Compress-Archive -Path "target\$env:TARGET\release\vtest.exe" -DestinationPath $archivePath
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $archivePath).Hash.ToLowerInvariant()
          "$hash  $archiveName" | Set-Content -Encoding ascii -NoNewline "$archivePath.sha256"
      - name: Upload packaged binary
        uses: actions/upload-artifact@v4
        with:
          name: vtest-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packaged binaries
        uses: actions/download-artifact@v4
        with:
          pattern: vtest-*
          path: dist
          merge-multiple: true
      - name: Create or update release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(dist/*)
          if (( ${#assets[@]} == 0 )); then
            echo "No release assets were produced." >&2
            exit 1
          fi

          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            release_options=(
              --repo "$GITHUB_REPOSITORY"
              --verify-tag
              --title "SpecTracer $TAG_NAME"
              --generate-notes
            )
            if [[ "$TAG_NAME" == *-* ]]; then
              release_options+=(--prerelease --latest=false)
            fi
            gh release create "$TAG_NAME" "${assets[@]}" \
              "${release_options[@]}"
          fi
