[package]
name = "vtest-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
vtest-adapter-api = { path = "../vtest-adapter-api" }
vtest-mcp = { path = "../vtest-mcp" }
vtest-model = { path = "../vtest-model" }
vtest-ops = { path = "../vtest-ops" }
vtest-scan = { path = "../vtest-scan" }
vtest-store = { path = "../vtest-store" }
vtest-verify = { path = "../vtest-verify" }

[dev-dependencies]
vtest-adapter-rust = { path = "../vtest-adapter-rust" }
vtest-adapter-synthetic = { path = "../vtest-adapter-synthetic" }
vtest-exec = { path = "../vtest-exec" }

[[bin]]
name = "vtest"
path = "src/main.rs"
# The binary is a thin entry point (parse, run, exit) with no unit tests of
# its own; the library and the integration tests carry the coverage.
test = false
