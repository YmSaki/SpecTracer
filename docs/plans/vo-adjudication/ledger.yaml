# VO 裁定台帳（4 監査レポート統合・Owner 行ごと裁定用）
#
# 出典: docs/reports/vo-coverage-matrix.md（coverage）/ vo-gap-candidates.md（lens）
#       / vo-gap-edge-local.md（edge-local）/ vo-thinness-audit.md（thinness）
# ブランチ v13 の現物のみを根拠とする。id・ハッシュは後段で機械付与するため付けない。
# 生の負の発見 127 件（coverage 20＝未カバー7＋対象外13 / lens 33 / edge-local 57 / thinness 17）
#   → 意味ベース dedup 後 104 件（23 件を畳んだ）。
# 内訳: 未カバー 45 / 弱い 22 / 機能欠落 17 / 太いVO 17 / 過剰VO 1 / 抽出漏れ疑い 2。
# severity は元レポートを引き継ぎ、複数レポートで割れた場合は高い方を採る。
# coverage は行別 severity を持たないため、帰結が偽合格経路のものを高、それ以外を中とした。
# proposal の先頭語は固定メニュー（追加／分割／§11移送／統合／対象外／削除）のいずれか。

