# VO トレーサビリティ・チェーンの正典データ（ノード + リンク + 意味）。
# 表示（階層リスト）はこのデータから gen.py が自動生成する。手書きしない。
# 各ノード: type / id(任意) / meaning / path・status(コードノード) / children。
# 意味(meaning)は各ノードに1回だけ書く。上流ノードは複数の枝で共有できる。
# ルート: 確定スペック第I部の要求・原則（VO がぶら下がるもののみ）。
# 生成元: docs/plans/vo-proposal.md の全 leaf VO 108本を鎖へ配置。

roots:
- type: 要求
  id: R-1
  label: 一次場面
  meaning: AI の完了報告を信じて、嘘の合格のままマージしてしまう事故を防ぎたい。
  children:
  - type: 要件
    id: 要件定義 §4.1／§13
    meaning: 宣言鎖のすべてのリンクが存在してハッシュ照合が成立するか、発見された各テストに対応する管理宣言がちょうど1件あり参照を解決できるかを検査できること。
    children:
    - type: 基本仕様
      id: 基本仕様 §5.1／§12
      meaning: 宣言鎖の完全性を検査の1つとして持つ。文書のリンク切れやハッシュ不一致、参照を解決できないテスト宣言、テスト識別子の衝突、検証実装を持たない末端の義務を、いずれも不一致として検出する。すべての管理対象テストに検証対象の義務を1件以上一律に要求する。
      children:
      - type: 詳細仕様
        id: 詳細設計 別紙C §18.3.1／本冊 §11.1.1
        meaning: 文書層・義務層・テスト層それぞれについて、参照先の存在・内容ハッシュの一致・管理宣言の唯一性・識別子の一意性・末端の義務からテストへの対応を判定する規則。
        children:
        - type: 項目
          meaning: 文書の導出元として宣言した参照先が存在しない
          children:
          - type: 実装
            meaning: 文書の導出元参照の解決
            path: crates/vtest-scan/
            status: 未
          - type: VO
            id: VO-CHAIN-DOC-01
            meaning: 導出元として参照する文書が見つからない文書を、宣言鎖のリンク切れとして不一致と判定できること。
            children:
            - type: テスト
              meaning: '入力: 存在しない文書を導出元に宣言した文書。宣言鎖の検査が不一致を返す必要がある（それ以外なら失敗）。'
              children:
              - type: テスト実装
                status: 未（#13 スコープ外）
        - type: 項目
          meaning: 文書の記録済み内容ハッシュが実ファイルと一致しない
          children:
          - type: 実装
            meaning: 文書の内容ハッシュと実ファイルの照合
            path: crates/vtest-scan/
            status: 未
          - type: VO
            id: VO-CHAIN-DOC-02
            meaning: 記録済み内容ハッシュが現物のファイルと一致しない文書を、鮮度喪失として不一致と判定できること。
            children:
            - type: テスト
              meaning: '入力: 登録後に本文が改変され内容ハッシュが実ファイルと食い違う文書。宣言鎖の検査が不一致（鮮度喪失の診断つき）を返す必要がある（それ以外なら失敗）。'
              children:
              - type: テスト実装
                status: 未（#13 スコープ外）
        - type: 項目
          meaning: 義務が解決可能な導出元文書を1件も持たない
          children:
          - type: 実装
            meaning: 義務から文書への導出リンクの解決
            path: crates/vtest-scan/
            status: 未
          - type: VO
            id: VO-CHAIN-VO-01
            meaning: 解決できる導出元文書を1件も持たない義務を、宣言鎖の不備として不一致と判定できること。
            children:
            - type: テスト
              meaning: '入力: 導出元文書への参照が解決できない義務。宣言鎖の検査が不一致を返す必要がある（それ以外なら失敗）。'
              children:
              - type: テスト実装
                status: 未（#13 スコープ外）
        - type: 項目
          meaning: 義務の親が存在しない、または親子関係が循環している
          children:
          - type: 実装
            meaning: 義務の親参照と循環の検出
            path: crates/vtest-scan/
            status: 未
          - type: VO
            id: VO-CHAIN-VO-02
            meaning: 親が存在しない、または親子関係が循環する義務を、宣言鎖の不備として不一致と判定できること。
            children:
            - type: テスト
              meaning: '入力: 存在しない親を指す、または循環した親子関係を持つ義務。宣言鎖の検査が不一致を返す必要がある（それ以外なら失敗）。'
              children:
              - type: テスト実装
                status: 未（#13 スコープ外）
        - type: 項目
          meaning: 発見されたテストに必須の管理宣言や必須メタデータが欠けている
          children:
          - type: 実装
            meaning: テストの管理宣言と必須メタデータの検査
            path: crates/vtest-scan/
            status: 旧モデル・未追随
          - type: VO
            id: VO-CHAIN-TEST-01
            meaning: 識別子・検証する義務の宣言・意図・アダプタ必須メタデータを欠くテストを、管理宣言の不備として不一致と判定できること。
            children:
            - type: テスト
              meaning: '入力: 識別子や検証対象の宣言を欠くテスト。宣言鎖の検査が不一致（欠落の診断つき）を返す必要がある（それ以外なら失敗）。'
              children:
              - type: テスト実装
                status: 未（#13 スコープ外）
        - type: 項目
          meaning: テストが検証する義務を1件も宣言していない
          children:
          - type: 実装
            meaning: 検証対象の義務の1件以上の一律要求
            path: crates/vtest-scan/
            status: 旧モデル・未追随
          - type: VO
            id: VO-CHAIN-TEST-02
            meaning: 検証する義務を1件も宣言しないテストを、役割による例外を設けず一律に不一致と判定できること。
            children:
            - type: テスト
              meaning: '入力: 検証する義務の宣言が0件のテスト。宣言鎖の検査が不一致（欠落の診断つき）を返す必要がある（それ以外なら失敗）。'
              children:
              - type: テスト実装
                status: 未（#13 スコープ外）
        - type: 項目
          meaning: テストが宣言した義務参照を解決できない
          children:
          - type: 実装
            meaning: テストの義務参照の解決
            path: crates/vtest-scan/
            status: 旧モデル・未追随
          - type: VO
            id: VO-CHAIN-TEST-03
            meaning: 宣言した義務参照が解決できないテストを、参照先を除去せず保持したまま不一致と判定できること。
            children:
            - type: テスト
              meaning: '入力: 存在しない義務を検証対象に宣言したテスト。宣言鎖の検査が不一致を返す必要がある（それ以外なら失敗）。'
              children:
              - type: テスト実装
                status: 未（#13 スコープ外）
        - type: 項目
          meaning: テスト識別子が発見結果全体で衝突している
          children:
          - type: 実装
            meaning: テスト識別子の大局的一意性の検査
            path: crates/vtest-scan/
            status: 旧モデル・未追随
          - type: VO
            id: VO-CHAIN-TEST-04
            meaning: テスト識別子が発見結果全体で一意でなく衝突している状態を、不一致と判定できること。
            children:
            - type: テスト
              meaning: '入力: 同一の識別子を持つ2つのテスト。宣言鎖の検査が不一致を返す必要がある（それ以外なら失敗）。'
              children:
              - type: テスト実装
                status: 未（#13 スコープ外）
        - type: 項目
          meaning: 末端の義務を検証するテストが1件も存在しない
          children:
          - type: 実装
            meaning: 末端の義務からテストへの対応の検査
            path: crates/vtest-scan/
            status: 未
          - type: VO
            id: VO-CHAIN-BIDIR-01
            meaning: 検証するテストを1件も持たない末端の義務を、双方向完全性の不備として不一致と判定できること。
            children:
            - type: テスト
              meaning: '入力: どのテストからも検証対象に挙げられていない末端の義務。宣言鎖の検査が不一致（欠落の診断つき）を返す必要がある（それ以外なら失敗）。'
              children:
              - type: テスト実装
                status: 未（#13 スコープ外）
        - type: 項目
          meaning: 関係リンクの端点が存在しない、または識別子の正規化が一致しない
          children:
          - type: 実装
            meaning: 関係リンクの端点解決と識別子正規化
            path: crates/vtest-scan/
            status: 旧モデル・未追随
          - type: VO
            id: VO-CHAIN-REL-01
            meaning: 端点の一方が存在しない、または識別子の正規化形が一致しない関係リンクを、不一致と判定できること。
            children:
            - type: テスト
              meaning: '入力: 存在しないノードを端点に持つ関係リンク。宣言鎖の検査が不一致を返す必要がある（それ以外なら失敗）。'
              children:
              - type: テスト実装
                status: 未（#13 スコープ外）
        - type: 項目
          meaning: 発見処理が失敗・不完全なのにテスト0件の正常走査として扱われる
          children:
          - type: 実装
            meaning: 発見失敗と空走査の区別
            path: crates/vtest-scan/
            status: 旧モデル・未追随
          - type: VO
            id: VO-CHAIN-DISC-01
            meaning: 発見が不完全・解析不能なとき、テスト0件の正常な走査結果とせず不明として扱えること。
            children:
            - type: テスト
              meaning: '入力: 一部の走査が解析不能で完了しなかった状態。当該検査が不明を返す必要がある（合格や不合格なら失敗）。'
              children:
              - type: テスト実装
                status: 未（#13 スコープ外）
  - type: 要件
    id: 要件定義 §4.4
    meaning: 宣言された不成立をテストの非成功として反映する照合装置が存在するかを検査できること。装置が無いと構造から証明できれば不合格、決定論で言い切れなければ不明とする。
    children:
    - type: 基本仕様
      id: 基本仕様 §5.4
      meaning: 照合装置の存在を検査の1つとして持つ。静的解析は不成立の証明だけを担い、証明できないものは不明として保ち、動的な合格昇格の経路を持たない。
      children:
      - type: 詳細仕様
        id: 詳細設計 別紙C §18.3.3／本冊 §7
        meaning: 確定した不成立構造だけを不合格とし解析限界を不明として保つ複数の判定と、それらを合成して1つの状態にする規則。
        children:
        - type: 項目
          meaning: 成否判定が定数で、どんな入力でも失敗し得ない
          children:
          - type: 実装
            meaning: 定数アサーションの検出
            path: crates/vtest-audit/
            status: 旧モデル・未追随
          - type: VO
            id: VO-ORACLE-DA001
            meaning: 成否判定が定数のテスト（常に真を主張する等）を不合格と判定できること。
            children:
            - type: テスト
              meaning: '入力: 本体で対象を呼んだ後に常に真だけを主張するテスト。照合装置の検査が不合格を返す必要がある（それ以外なら失敗）。'
              children:
              - type: テスト実装
                status: 未（#13 スコープ外）
        - type: 項目
          meaning: 対象を呼ぶが結果を成否判定に使っていない
          children:
          - type: 実装
            meaning: 対象呼び出しと結果未使用の検出
            path: crates/vtest-audit/
            status: 旧モデル・未追随
          - type: VO
            id: VO-ORACLE-DA003
            meaning: 対象を呼び出すが結果を成否判定に用いていないテストを不合格と判定でき、可変参照やグローバル経由で結果が伝わりうる場合は不明とできること。
            children:
            - type: テスト
              meaning: '入力: 対象を呼んだ後に戻り値を見ずに別の定数を主張するテスト。照合装置の検査が不合格を返す必要がある（結果が間接的に伝わりうる構造なら不明。それ以外なら失敗）。'
              children:
              - type: テスト実装
                status: 未（#13 スコープ外）
        - type: 項目
          meaning: 観測同士の自己比較で成否が対象の振る舞いに依存しない
          children:
          - type: 実装
            meaning: 自己比較の検出
            path: crates/vtest-audit/
            status: 旧モデル・未追随
          - type: VO
            id: VO-ORACLE-DA004
            meaning: 同じ観測値どうしを比較する自己比較のテストを不合格と判定できること。
            children:
            - type: テスト
              meaning: '入力: 対象の戻り値をそれ自身と比較するテスト。照合装置の検査が不合格を返す必要がある（それ以外なら失敗）。'
              children:
              - type: テスト実装
                status: 未（#13 スコープ外）
        - type: 項目
          meaning: テスト本体が空である
          children:
          - type: 実装
            meaning: 空テスト本体の検出
            path: crates/vtest-audit/
            status: 旧モデル・未追随
          - type: VO
            id: VO-ORACLE-DA005
            meaning: 本体が空のテストを不合格と判定できること。
            children:
            - type: テスト
              meaning: '入力: 本体に何も書かれていないテスト。照合装置の検査が不合格を返す必要がある（それ以外なら失敗）。'
              children:
              - type: テスト実装
                status: 未（#13 スコープ外）
        - type: 項目
          meaning: 成否を左右するアサーション相当が1つも無い
          children:
          - type: 実装
            meaning: アサーション不在の検出
            path: crates/vtest-audit/
            status: 旧モデル・未追随
          - type: VO
            id: VO-ORACLE-DA006
            meaning: 成否を左右するアサーション相当を1つも持たないテストを不合格と判定できること。
            children:
            - type: テスト
              meaning: '入力: 対象を呼ぶだけでアサーション相当が全く無いテスト。照合装置の検査が不合格を返す必要がある（それ以外なら失敗）。'
              children:
              - type: テスト実装
                status: 未（#13 スコープ外）
        - type: 項目
          meaning: 複数の不成立パターンの判定を1つの状態へ合成する
          children:
          - type: 実装
            meaning: 不成立パターン判定の合成
            path: crates/vtest-audit/
            status: 旧モデル・未追随
          - type: VO
            id: VO-ORACLE-COMPOSE
            meaning: 複数の不成立パターン判定を合成し、全て違反なしなら合格、1つでも不合格があれば不合格、不合格が無く不明があれば不明と定めること。
            children:
            - type: テスト
              meaning: '入力: 一部パターンが不明で残りが違反なしのテスト。照合装置の検査が不明を返す必要がある（不合格や合格なら失敗）。'
              children:
              - type: テスト実装
                status: 未（#13 スコープ外）
        - type: 項目
          meaning: 動的証拠による合格昇格の経路が無い
          children:
          - type: 実装
            meaning: 照合装置検査の動的昇格の禁止
            path: crates/vtest-audit/
            status: 未
          - type: VO
            id: VO-ORACLE-NOPROMOTE
            meaning: 照合装置の検査に動的な合格昇格の経路が無く、証明できない場合は不明のままで実行結果により合格へ変えないこと。
            children:
            - type: テスト
              meaning: '入力: 静的に証明できず不明となったテストと、その対象を実行した動的証拠。照合装置の検査が不明のままである必要がある（合格へ昇格したら失敗）。'
              children:
              - type: テスト実装
                status: 未（#13 スコープ外）
        - type: 項目
          meaning: 確定違反だけを不合格とし、クロージャ内やマクロ展開内は不明とする
          children:
          - type: 実装
            meaning: 解析限界の不明扱い
            path: crates/vtest-audit/
            status: 旧モデル・未追随
          - type: VO
            id: VO-ORACLE-CONSERV
            meaning: 確定した違反だけを不合格とし、クロージャ内やマクロ展開内など静的に追い切れない箇所は不明とできること。
            children:
            - type: テスト
              meaning: '入力: 照合がマクロ展開の内側にあり静的に追えないテスト。照合装置の検査が不明を返す必要がある（不合格や合格なら失敗）。'
              children:
              - type: テスト実装
                status: 未（#13 スコープ外）
        - type: 項目
          meaning: 本体に呼び出しの無い別プロセス実行では照合装置検査と検証対象実現検査が別々の値をとる
          children:
          - type: 実装
            meaning: 別プロセス実行での2検査分裂の保持
            path: crates/vtest-audit/
            status: 未
          - type: VO
            id: VO-ORACLE-SUBPROC-SPLIT
            meaning: 本体で対象を呼ばない別プロセス型の検証で、照合装置検査は不明のまま残り、検証対象実現の検査は動的に到達しうる、という2検査の分裂を保てること。総合は不合格とする。
            children:
            - type: テスト
              meaning: '入力: 対象を別プロセスで起動し終了コードだけを検査するテスト。照合装置の検査が不明を返し、総合判定が不合格になる必要がある（照合装置が合格になったら失敗）。'
              children:
              - type: テスト実装
                status: 未（#13 スコープ外）
        - type: 項目
          meaning: 静的解析は正典レコードを持たない再計算派生で監査レコードを永続化しない
          children:
          - type: 実装
            meaning: 静的解析結果の非永続化
            path: crates/vtest-audit/
            status: 旧モデル・未追随
          - type: VO
            id: VO-ORACLE-RECALC
            meaning: 静的解析の結果を正典として永続化せず、検証のたびに現在のソースから再計算する派生として扱えること。
            children:
            - type: テスト
              meaning: '入力: 静的解析を要求した検証。正典の監査レコードが生成されない必要がある（永続レコードが作られたら失敗）。'
              children:
              - type: テスト実装
                status: 未（#13 スコープ外）
        - type: 項目
          meaning: 判定に用いたソース断片の完全性を保証できない
          children:
          - type: 実装
            meaning: ソース断片の完全性による不明化
            path: crates/vtest-audit/
            status: 未
          - type: VO
            id: VO-ORACLE-FRAGMENT
            meaning: 判定に用いたソース断片集合の完全性を保証できない場合、その判定を不明とし合格にしないこと。
            children:
            - type: テスト
              meaning: '入力: 判定に必要なソース断片の一部を収集できなかった状態。照合装置の検査が不明を返す必要がある（合格なら失敗）。'
              children:
              - type: テスト実装
                status: 未（#13 スコープ外）
  - type: 要件
    id: 要件定義 §4.3
    meaning: 宣言された検証対象の振る舞いが実際に生じ、それを反映した観測が得られたかを検査できること。実行回数が0なら不合格、静的に確定できなければ不明とし、動的な証拠で合格へ昇格できる。
    children:
    - type: 基本仕様
      id: 基本仕様 §5.3
      meaning: 検証対象の実現を検査の1つとして持つ。宣言対象ごとに実行を個別に計測し、静的到達と動的計測の2つの証拠源で1つの問いに答える。
      children:
      - type: 詳細仕様
        id: 詳細設計 別紙C §18.3.5／§18.3.3／本冊 §7.3・§10.2
        meaning: 宣言対象ごとの静的到達判定と動的計測、複数対象の集約、境界を越える実行の扱い、静的な不合格が動的証拠で覆らないこと、実行結果と到達充足から状態を定める規則。
        children:
        - type: 項目
          meaning: 対象を境界内で呼び出していないと静的に確定できる／別ファイルや別クレートで確定できない
          children:
          - type: 実装
            meaning: 宣言対象への静的到達の分類
            path: crates/vtest-audit/
            status: 旧モデル・未追随
          - type: VO
            id: VO-TARGET-STATIC-01
            meaning: 対象の呼び出しが解析境界内に無いと確定できれば対象別に不合格、別ファイルや別クレートで確定できなければ不明と判定できること。
            children:
            - type: テスト
              meaning: '入力: 同一ファイル内のどこからも宣言対象を呼ばないテスト。当該対象の静的到達が不合格を返す必要がある（別ファイル経由で追えない場合は不明。それ以外なら失敗）。'
              children:
              - type: テスト実装
                status: 未（#13 スコープ外）
        - type: 項目
          meaning: 静的に到達を否定した不合格は動的証拠で覆らない
          children:
          - type: 実装
            meaning: 静的不合格の動的非救済
            path: crates/vtest-audit/
            status: 未
          - type: VO
            id: VO-TARGET-STATIC-02
            meaning: 解析境界内で到達を静的に否定した不合格は、後からの動的な実行証明によって覆らないこと。
            children:
            - type: テスト
              meaning: '入力: 静的に不合格と確定した対象と、それを実行したとする動的証拠。当該対象の到達判定が不合格のままである必要がある（合格へ覆ったら失敗）。'
              children:
              - type: テスト実装
                status: 未（#13 スコープ外）
        - type: 項目
          meaning: 対象ごとの実行回数から到達を判定する
          children:
          - type: 実装
            meaning: 対象別の実行回数計測
            path: crates/vtest-exec/
            status: 未
          - type: VO
            id: VO-TARGET-RT-01
            meaning: 対象ごとの計測回数が1以上なら対象別合格、0なら対象別不合格、確実に同定・計測できなければ対象別不明と判定できること。
            children:
            - type: テスト
              meaning: '入力: 宣言対象を1度も実行しないまま合格したテストの動的計測。当該対象の到達が不合格（未実行の診断つき）を返す必要がある（それ以外なら失敗）。'
              children:
              - type: テスト実装
                status: 未（#13 スコープ外）
        - type: 項目
          meaning: 静的に不明な対象は動的計測が合格のときだけ到達充足とする
          children:
          - type: 実装
            meaning: 静的不明対象の動的到達充足
            path: crates/vtest-exec/
            status: 未
          - type: VO
            id: VO-TARGET-RT-02
            meaning: 静的到達が不明の対象について、その対象の動的計測が合格（計測済みで回数が正）のときに限り到達要件を充足したと扱えること。
            children:
            - type: テスト
              meaning: '入力: 静的に不明だが動的計測で実行回数が正の対象。当該対象の到達要件が充足される必要がある（動的計測が無ければ未充足のまま。誤って充足したら失敗）。'
              children:
              - type: テスト実装
                status: 未（#13 スコープ外）
        - type: 項目
          meaning: 複数対象を集約して1つの値にする
          children:
          - type: 実装
            meaning: 複数対象の集約規則
            path: crates/vtest-exec/
            status: 未
          - type: VO
            id: VO-TARGET-MULTI-01
            meaning: 複数対象の集約を、1件でも不合格なら不合格、不合格が無く不明があれば不明、全対象が合格のときだけ合格と定めること。
            children:
            - type: テスト
              meaning: '入力: 対象Aが合格・対象Bが不合格の複数対象テスト。検証対象実現の集約値が不合格を返す必要がある（合格なら失敗）。'
              children:
              - type: テスト実装
                status: 未（#13 スコープ外）
        - type: 項目
          meaning: 別プロセスや別スレッドの境界を越える実行の扱い
          children:
          - type: 実装
            meaning: 境界越え実行の帰属判定
            path: crates/vtest-exec/
            status: 未
          - type: VO
            id: VO-TARGET-BOUNDARY-01
            meaning: 別プロセスや別スレッドの境界を越える実行では静的到達を不明とし、動的計測が当該境界越えの実行を宣言対象へ帰属できれば対象別合格にできること。
            children:
            - type: テスト
              meaning: '入力: 対象を別スレッドで実行するテストと、その実行を対象へ帰属できる計測。静的到達は不明で、動的計測が対象別合格を返す必要がある（帰属できなければ不明。それ以外なら失敗）。'
              children:
              - type: テスト実装
                status: 未（#13 スコープ外）
        - type: 項目
          meaning: 有効な証拠がテスト失敗を示せば検証対象実現も不合格
          children:
          - type: 実装
            meaning: ランナー失敗結果の反映
            path: crates/vtest-exec/
            status: 未
          - type: VO
            id: VO-TARGET-RESULT-01
            meaning: 有効な証拠のテスト結果が失敗を示す場合、検証対象実現の検査を不合格と判定できること。
            children:
            - type: テスト
              meaning: '入力: テストランナーが失敗を報告した有効な証拠。検証対象実現の検査が不合格を返す必要がある（それ以外なら失敗）。'
              children:
              - type: テスト実装
                status: 未（#13 スコープ外）
        - type: 項目
          meaning: テスト合格かつ全対象の到達充足のときだけ合格、未充足は原因別に降格する
          children:
          - type: 実装
            meaning: 合格結果と到達充足からの状態決定
            path: crates/vtest-exec/
            status: 未
          - type: VO
            id: VO-TARGET-PASS-01
            meaning: テスト結果が合格でかつ全宣言対象の到達要件を充足したときだけ合格とし、未充足の対象は実行0回なら不合格、未計測なら証拠なし、対象が見当たらなければ不明と分けられること。
            children:
            - type: テスト
              meaning: '入力: テストは合格だが一部の対象が未計測の証拠。検証対象実現の検査が証拠なし（未計測の診断つき）を返す必要がある（合格なら失敗）。'
              children:
              - type: テスト実装
                status: 未（#13 スコープ外）
        - type: 項目
          meaning: どの形態でも対象を実行しない契約のみのテストは到達未充足のまま
          children:
          - type: 実装
            meaning: 非実行契約テストの未充足保持
            path: crates/vtest-audit/
            status: 未
          - type: VO
            id: VO-TARGET-CONTRACT-01
            meaning: どの実行形態でも宣言対象を実行しない契約のみのテストは、静的にも動的にも到達を確立できず未充足のままになること。
            children:
            - type: テスト
              meaning: '入力: 宣言対象を一切実行しない、契約だけを確認するテスト。検証対象実現の到達要件が未充足のまま合格にならない必要がある（合格なら失敗）。'
              children:
              - type: テスト実装
                status: 未（#13 スコープ外）
        - type: 項目
          meaning: 計測能力やツールが無い／解析限界に達した
          children:
          - type: 実装
            meaning: 計測能力欠如と解析限界の扱い
            path: crates/vtest-exec/
            status: 未
          - type: VO
            id: VO-TARGET-CAP-01
            meaning: 計測能力や計測ツールが利用できない場合は証拠なし（未計測）、解析限界に達した場合は不明と判定できること。
            children:
            - type: テスト
              meaning: '入力: 計測ツールを利用できない環境での検証。検証対象実現の検査が証拠なし（未計測の診断つき）を返す必要がある（合格なら失敗）。'
              children:
              - type: テスト実装
                status: 未（#13 スコープ外）
        - type: 項目
          meaning: 動的到達は照合装置検査を代替しない
          children:
          - type: 実装
            meaning: 動的到達と照合装置検査の分離
            path: crates/vtest-audit/
            status: 未
          - type: VO
            id: VO-TARGET-NODA003-01
            meaning: 動的な実行到達が充足されても、それは結果検証の照合装置検査を代替せず、照合装置側の不明や不合格はそのまま総合へ寄与すること。
            children:
            - type: テスト
              meaning: '入力: 対象への到達は動的に充足するが結果を検証していないテスト。照合装置の検査が不合格または不明を保ち総合へ寄与する必要がある（到達充足を理由に合格化したら失敗）。'
              children:
              - type: テスト実装
                status: 未（#13 スコープ外）
  - type: 要件
    id: 要件定義 §6
    meaning: 証拠は検証対象の内容ハッシュに束縛し、現在のソースのハッシュと一致しない証拠は存在しないものとして扱うこと。
    children:
    - type: 基本仕様
      id: 基本仕様 §6／§21.1
      meaning: 証拠ストアはハッシュキーを必須とし、テストの意味・実行条件・対象実装・実行可能状態が現在と一致することをハッシュ束縛で保証する。鮮度の独立検査は設けず、鮮度喪失は診断ラベルで説明する。
      children:
      - type: 詳細仕様
        id: 詳細設計 別紙C §18.3.4／本冊 §11.2
        meaning: 検証対象・対象集合・リビジョン・実行可能状態・アダプタ識別のそれぞれについて現在との一致を確かめ、不一致や解決不能を証拠なしや不明として扱う規則と、証拠生成の前提条件。
        children:
        - type: 項目
          meaning: 証拠を検証対象の内容ハッシュに束縛しストアのキーとする
          children:
          - type: 実装
            meaning: 証拠のハッシュ束縛ストア
            path: crates/vtest-exec/
            status: 旧モデル・未追随
          - type: VO
            id: VO-EVIDENCE-BIND-01
            meaning: 証拠を検証対象の内容ハッシュへ束縛し、ストアがハッシュをキーとして必須とすること。
            children:
            - type: テスト
              meaning: '入力: 検証対象の内容ハッシュを持つ証拠。証拠がそのハッシュをキーとして格納・取得できる必要がある（ハッシュキー無しで格納できたら失敗）。'
              children:
              - type: テスト実装
                status: 未（#13 スコープ外）
        - type: 項目
          meaning: テスト本体の内容ハッシュが証拠と食い違う（非隣接メタデータの変更を含む）
          children:
          - type: 実装
            meaning: テスト本体ハッシュの鮮度照合
            path: crates/vtest-exec/
            status: 未
          - type: VO
            id: VO-EVIDENCE-FRESH-SUBJECT
            meaning: テスト本体の内容ハッシュが証拠時点と食い違う場合、離れた位置のメタデータ変更を含め、証拠を証拠なし（鮮度喪失）と判定できること。
            children:
            - type: テスト
              meaning: '入力: テストの非隣接メタデータだけを変えて本体ハッシュが変化した状態。検証対象実現の証拠が証拠なし（鮮度喪失の診断つき）になる必要がある（合格なら失敗）。'
              children:
              - type: テスト実装
                status: 未（#13 スコープ外）
        - type: 項目
          meaning: 対象の参照集合や構成ハッシュが証拠と食い違う
          children:
          - type: 実装
            meaning: 対象ハッシュの鮮度照合
            path: crates/vtest-exec/
            status: 未
          - type: VO
            id: VO-EVIDENCE-FRESH-TARGET
            meaning: 宣言対象の参照集合または対象構成の内容ハッシュが証拠時点と食い違う場合、証拠を証拠なし（鮮度喪失）と判定できること。
            children:
            - type: テスト
              meaning: '入力: 証拠記録後に対象の実装本体を変更して対象ハッシュが変化した状態。検証対象実現の証拠が証拠なし（鮮度喪失の診断つき）になる必要がある（合格なら失敗）。'
              children:
              - type: テスト実装
                status: 未（#13 スコープ外）
        - type: 項目
          meaning: 証拠のリビジョンが特定できない／現在の先頭と一致しない
          children:
          - type: 実装
            meaning: リビジョン一致の照合
            path: crates/vtest-exec/
            status: 未
          - type: VO
            id: VO-EVIDENCE-FRESH-REVISION
            meaning: 証拠のリビジョンが特定できない、または現在の先頭リビジョンと一致しない場合、証拠を証拠なし（鮮度喪失）と判定できること。
            children:
            - type: テスト
              meaning: '入力: リビジョンを特定できない証拠。検証対象実現の証拠が証拠なし（鮮度喪失の診断つき）になる必要がある（有効な合格として扱ったら失敗）。'
              children:
              - type: テスト実装
                status: 未（#13 スコープ外）
        - type: 項目
          meaning: 対象外ヘルパや依存・ランナー・ツールチェーン・設定など実行可能状態が食い違う
          children:
          - type: 実装
            meaning: 実行可能状態の鮮度照合
            path: crates/vtest-exec/
            status: 未
          - type: VO
            id: VO-EVIDENCE-FRESH-EXECSTATE
            meaning: 対象外ヘルパ・依存・ランナー・ツールチェーン・設定などの実行可能状態が証拠時点と食い違う場合は証拠なし（鮮度喪失）、その完全性を確かめられない場合は不明と判定できること。
            children:
            - type: テスト
              meaning: '入力: テストも宣言対象も変えず対象外ヘルパだけを変更した状態。既存証拠が証拠なし（鮮度喪失の診断つき）になる必要がある（合格なら失敗）。'
              children:
              - type: テスト実装
                status: 未（#13 スコープ外）
        - type: 項目
          meaning: 証拠のアダプタ識別が食い違う／確認できない
          children:
          - type: 実装
            meaning: アダプタ識別の照合
            path: crates/vtest-exec/
            status: 未
          - type: VO
            id: VO-EVIDENCE-FRESH-ADAPTER
            meaning: 証拠のアダプタ識別が現在と食い違う場合は不一致、確認できない場合は不明と判定できること。
            children:
            - type: テスト
              meaning: '入力: 実行アダプタと異なるアダプタ識別を持つ証拠。検証対象実現の証拠が不一致になる必要がある（有効な合格として扱ったら失敗）。'
              children:
              - type: テスト実装
                status: 未（#13 スコープ外）
        - type: 項目
          meaning: 全対象が一意に解決できないと証拠を生成しない
          children:
          - type: 実装
            meaning: 全対象一意解決の生成前提
            path: crates/vtest-exec/
            status: 未
          - type: VO
            id: VO-EVIDENCE-GEN-01
            meaning: 全宣言対象が一意に解決できることを証拠生成の前提とし、1件でも対象が無いか曖昧なら部分的な証拠を作らず生成しないこと。
            children:
            - type: テスト
              meaning: '入力: 宣言対象の1件が複数候補に曖昧化した状態での実行。証拠を生成せず検証対象実現が証拠なし（未実行の診断つき）になる必要がある（部分証拠を生成したら失敗）。'
              children:
              - type: テスト実装
                status: 未（#13 スコープ外）
        - type: 項目
          meaning: ビルド失敗・ランナー失敗・能力欠如・対象解決失敗・前後の状態変化では証拠を生成しない
          children:
          - type: 実装
            meaning: 証拠生成の中止条件
            path: crates/vtest-exec/
            status: 未
          - type: VO
            id: VO-EVIDENCE-GEN-02
            meaning: ビルド失敗・ランナー失敗・必須能力の欠如・対象解決の失敗・実行前後の実行可能状態の変化のいずれかでは証拠を生成しないこと。
            children:
            - type: テスト
              meaning: '入力: 実行の前後で実行可能状態が変化した実行。証拠が生成されない必要がある（証拠を生成したら失敗）。'
              children:
              - type: テスト実装
                status: 未（#13 スコープ外）
        - type: 項目
          meaning: 最新証拠が鮮度喪失のとき古い有効証拠へ後退しない
          children:
          - type: 実装
            meaning: 鮮度喪失時の後退禁止
            path: crates/vtest-exec/
            status: 未
          - type: VO
            id: VO-EVIDENCE-NOFALLBACK
            meaning: 最新の証拠が鮮度を失っているとき、過去の古い有効な証拠へ後退して合格にしないこと。
            children:
            - type: テスト
              meaning: '入力: 最新証拠が鮮度喪失で、過去に有効だった古い証拠が残る状態。検証対象実現が古い証拠で合格にならない必要がある（後退して合格化したら失敗）。'
              children:
              - type: テスト実装
                status: 未（#13 スコープ外）
        - type: 項目
          meaning: 内容ハッシュはアダプタが自己確定せず中核が言語非依存に正規化する
          children:
          - type: 実装
            meaning: 中核による言語非依存ハッシュ計算
            path: crates/vtest-scan/
            status: 未
          - type: VO
            id: VO-EVIDENCE-HASH-CORE
            meaning: 内容ハッシュをアダプタが最終確定せず、中核が言語非依存の正規化を行って計算すること（アダプタはハッシュ未計算の中間データを返す）。
            children:
            - type: テスト
              meaning: '入力: アダプタが返すハッシュ未計算の発見データ。中核が正規化してハッシュを計算し具体化する必要がある（アダプタ確定ハッシュをそのまま採用したら失敗）。'
              children:
              - type: テスト実装
                status: 未（#13 スコープ外）
  - type: 要件
    id: 要件定義 §7
    meaning: テスト合否の判定権威は当該アダプタのテストランナーにあり、本システムは合否を判定せずランナーの結果を証拠として消費すること。
    children:
    - type: 基本仕様
      id: 基本仕様 §7
      meaning: 本システムはランナーの合否を再判定せず証拠として使う。検証対象実現の検査は、ランナーの合格を前提に実行を伴ったかを問う独立した照合である。
      children:
      - type: 詳細仕様
        id: 詳細設計 本冊 §9／§11.2
        meaning: 登録テストを厳密選択で実行してランナー結果を証拠へ記録し、その結果を検証対象実現の判定に取り込む処理。
        children:
        - type: 項目
          meaning: 合否判定はランナーが行い本システムは再判定しない
          children:
          - type: 実装
            meaning: ランナー結果の証拠消費
            path: crates/vtest-exec/
            status: 旧モデル・未追随
          - type: VO
            id: VO-AUTHORITY-01
            meaning: テスト合否の権威をアダプタのランナーに置き、本システムは再判定せずその結果を証拠として消費すること。
            children:
            - type: テスト
              meaning: '入力: ランナーが合格を報告したテスト。本システムが合否を再判定せずランナー結果を証拠として取り込む必要がある（独自に合否を再計算したら失敗）。'
              children:
              - type: テスト実装
                status: 未（#13 スコープ外）
        - type: 項目
          meaning: 検証対象実現はランナー合格を前提に実行を伴ったかを問う
          children:
          - type: 実装
            meaning: 実行随伴の独立照合
            path: crates/vtest-verify/
            status: 未
          - type: VO
            id: VO-AUTHORITY-02
            meaning: 検証対象実現の検査を、ランナーの合格を前提として実行を実際に伴ったかを問う独立の照合として位置づけられること。
            children:
            - type: テスト
              meaning: '入力: ランナー合格だが対象を実行していないテスト。検証対象実現の検査が独立に非合格を返す必要がある（ランナー合格を理由に合格化したら失敗）。'
              children:
              - type: テスト実装
                status: 未（#13 スコープ外）
  - type: 要件
    id: 要件定義 §19／§5.5
    meaning: 承認は検証状態と独立の別軸であり、承認済みを理由に非合格を合格へ、未承認を理由に合格を降格させないこと。承認は対象と依存物の現在のハッシュに束縛すること。
    children:
    - type: 基本仕様
      id: 基本仕様 §4.5／§17
      meaning: 承認を検証状態と混同しない。承認は対象と上流依存の内容ハッシュへ束縛され、いずれかが変われば失効する。承認主体は人間にもエージェントにも与えうる。
      children:
      - type: 詳細仕様
        id: 詳細設計 別紙C §18.3.7／本冊 §3.5
        meaning: 義務の実効承認を、対象ハッシュ一致かつ依存閉包が完全一致する承認記録の存在から導出し、依存閉包やハッシュを欠く承認を有効化しない規則。
        children:
        - type: 項目
          meaning: 承認済みで非合格を合格へ昇格させず、未承認で合格を降格させない
          children:
          - type: 実装
            meaning: 承認と検証状態の独立
            path: crates/vtest-verify/
            status: 未
          - type: VO
            id: VO-APPROVAL-INDEP
            meaning: 承認は独立の軸であり、承認済みを理由に非合格を合格へ昇格させず、未承認を理由に合格を降格させないこと。
            children:
            - type: テスト
              meaning: '入力: 承認済みだが検証結果が不合格の対象。検証状態が不合格のままである必要がある（承認を理由に合格化したら失敗）。'
              children:
              - type: テスト実装
                status: 未（#13 スコープ外）
        - type: 項目
          meaning: 判断済みと承認済みを区別し別記録でありうる
          children:
          - type: 実装
            meaning: 判断と承認の区別
            path: crates/vtest-store/
            status: 未
          - type: VO
            id: VO-APPROVAL-DISTINCT
            meaning: 判断済みと承認済みを区別し、判断記録と承認記録が別のものでありうると扱えること。
            children:
            - type: テスト
              meaning: '入力: 判断は記録されているが承認されていない対象。判断済みと承認済みが別状態として区別される必要がある（同一視したら失敗）。'
              children:
              - type: テスト実装
                status: 未（#13 スコープ外）
        - type: 項目
          meaning: 実効承認は対象ハッシュ一致かつ依存閉包の完全一致で導く
          children:
          - type: 実装
            meaning: 依存閉包一致による実効承認導出
            path: crates/vtest-store/
            status: 未
          - type: VO
            id: VO-APPROVAL-CLOSURE
            meaning: 義務の実効承認を、対象ハッシュが一致し依存閉包（再帰的な親義務・導出元文書・上位文書）が完全一致する承認が1件以上あるときに承認済み、それ以外を下書きと導けること。
            children:
            - type: テスト
              meaning: '入力: 対象ハッシュと依存閉包が現在と完全一致する承認を持つ義務。実効承認が承認済みになる必要がある（不一致要素があるのに承認済みにしたら失敗）。'
              children:
              - type: テスト実装
                status: 未（#13 スコープ外）
        - type: 項目
          meaning: 対象や依存成果物の変更で承認が失効する
          children:
          - type: 実装
            meaning: 変更による承認失効
            path: crates/vtest-store/
            status: 未
          - type: VO
            id: VO-APPROVAL-STALE
            meaning: 対象または依存成果物（文書の再登録を含む）が変更されると承認が失効すること。
            children:
            - type: テスト
              meaning: '入力: 承認後に導出元文書を再登録して依存ハッシュが変化した状態。実効承認が失効し下書き相当になる必要がある（承認済みのままなら失敗）。'
              children:
              - type: テスト実装
                status: 未（#13 スコープ外）
        - type: 項目
          meaning: 依存閉包やハッシュを欠く承認は有効化せず、作成時に解決不能なら記録しない
          children:
          - type: 実装
            meaning: 閉包欠如承認の非有効化
            path: crates/vtest-store/
            status: 未
          - type: VO
            id: VO-APPROVAL-NOCLOSURE
            meaning: 依存閉包やハッシュを欠く互換承認から承認済みを導かず、承認作成時に対象や依存を完全に解決できない場合は記録を生成しないこと。
            children:
            - type: テスト
              meaning: '入力: 依存閉包を持たない古い形式の承認。承認済みを導かない必要がある（承認済みへ昇格したら失敗）。'
              children:
              - type: テスト実装
                status: 未（#13 スコープ外）
        - type: 項目
          meaning: 義務の状態は正典フィールドでなく承認から導出する
          children:
          - type: 実装
            meaning: 承認からの状態導出
            path: crates/vtest-store/
            status: 未
          - type: VO
            id: VO-APPROVAL-STATUS-DERIVED
            meaning: 義務の状態を正典フィールドとして保存せず承認から導出し、書き手は保存せず読み手は保存された互換フィールドを無視できること。
            children:
            - type: テスト
              meaning: '入力: 状態フィールドが保存された古い形式の義務レコード。状態を承認から導出し保存値を無視する必要がある（保存値を採用したら失敗）。'
              children:
              - type: テスト実装
                status: 未（#13 スコープ外）
        - type: 項目
          meaning: 承認記録は承認者・対象または判断参照・承認状態を必須とし根拠は任意
          children:
          - type: 実装
            meaning: 承認記録の必須項目
            path: crates/vtest-store/
            status: 未
          - type: VO
            id: VO-APPROVAL-RECORD
            meaning: 承認記録が承認者（人間かエージェントの種別と識別子）・対象または判断参照・承認状態を必須項目として持ち、根拠を任意にできること。
            children:
            - type: テスト
              meaning: '入力: 承認者と対象と承認状態を持ち根拠が空の承認記録。有効な承認記録として受理される必要がある（根拠が空を理由に拒否したら失敗）。'
              children:
              - type: テスト実装
                status: 未（#13 スコープ外）
  - type: 要件
    id: 要件定義 §26.4
    meaning: 登録されたフェーズ・工程・ゲートの進行条件について、現在の検証状態と承認が通過条件を満たすかを評価・提示できること。フェーズの自動遷移は責務外とする。
    children:
    - type: 基本仕様
      id: 基本仕様 §20
      meaning: ゲート条件が現在満たされているかの評価・提示に責務を限り、フェーズのライフサイクル管理や工程の自動遷移は行わない。
      children:
      - type: 詳細仕様
        id: 詳細設計 別紙C §18.3.9／別紙A §12.3
        meaning: 設定に保持したゲート定義について、検証結果が要求水準を満たすかと要求ロールの有効承認が存在するかを評価し満否と根拠を提示する。承認ロールは設定でロールから承認者へ解決する。
        children:
        - type: 項目
          meaning: 検証結果と要求承認の充足を評価し満否と根拠を提示する
          children:
          - type: 実装
            meaning: ゲート条件の評価と提示
            path: crates/vtest-verify/
            status: 未
          - type: VO
            id: VO-GATE-EVAL
            meaning: 指定ゲートについて、検証結果が要求する水準を満たすかと、要求する各ロールの有効な承認が存在するかを評価し、満否と根拠を新規コマンドを増やさず既存の検証・報告経路で提示できること。
            children:
            - type: テスト
              meaning: '入力: 検証は合格だが要求ロールの承認が欠けたゲート指定。ゲート評価が不足（未充足の承認ロールを根拠に）を返す必要がある（満たしたと返したら失敗）。'
              children:
              - type: テスト実装
                status: 未（#13 スコープ外）
        - type: 項目
          meaning: 責務は評価・提示に限りフェーズを自動遷移させない
          children:
          - type: 実装
            meaning: 自動遷移の不実施
            path: crates/vtest-verify/
            status: 未
          - type: VO
            id: VO-GATE-NOTRANSITION
            meaning: ゲートの責務を評価・提示に限り、フェーズを自動的に遷移させないこと。
            children:
            - type: テスト
              meaning: '入力: 条件を満たしたゲート。条件充足の提示だけを行いフェーズ遷移を実行しない必要がある（自動遷移したら失敗）。'
              children:
              - type: テスト実装
                status: 未（#13 スコープ外）
        - type: 項目
          meaning: 承認ロールから承認者を解決し、未定義ロール参照は設定違反
          children:
          - type: 実装
            meaning: 承認ロールの解決
            path: crates/vtest-verify/
            status: 未
          - type: VO
            id: VO-GATE-ROLE-RESOLVE
            meaning: 設定でロールから承認者集合を解決し、ゲートが参照するロールが設定に無い場合を設定違反と判定できること。
            children:
            - type: テスト
              meaning: '入力: ゲートが参照するロールが承認者対応表に無い設定。設定違反を返す必要がある（そのまま評価を続けたら失敗）。'
              children:
              - type: テスト実装
                status: 未（#13 スコープ外）
  - type: 要件
    id: 要件定義 §22
    meaning: 主要インターフェースは AI エージェント向けの機械インターフェースとコマンド行の2つとし、機械インターフェースは飾りでなく本体である。
    children:
    - type: 基本仕様
      id: 基本仕様 §26.2
      meaning: 機械インターフェースの全ツールは、同一入力に対してコマンド行と同じデータと診断を返す。両者は同じ処理・アダプタ選択・出力形式を共有する。
      children:
      - type: 詳細仕様
        id: 詳細設計 別紙C §18.3.11／別紙A §13
        meaning: 全ツールの入出力一致、要求・通知・バッチ・不正入力の規約どおりの処理、長時間実行中の再走査による古い合格の排除。
        children:
        - type: 項目
          meaning: 全ツールが同一入力にコマンド行と同じデータ・診断を返す
          children:
          - type: 実装
            meaning: コマンド行と機械インターフェースの同一性
            path: crates/vtest-mcp/
            status: 旧モデル・未追随
          - type: VO
            id: VO-IFACE-PARITY
            meaning: 機械インターフェースの全ツールが同一入力に対しコマンド行と同じデータと診断を返し、同じ処理構成とアダプタ選択とエラー体系を共有すること。
            children:
            - type: テスト
              meaning: '入力: 同一の検証要求をコマンド行と機械インターフェースの双方へ与える。両者が同じデータと診断を返す必要がある（結果が食い違ったら失敗）。'
              children:
              - type: テスト実装
                status: 未（#13 スコープ外）
        - type: 項目
          meaning: 要求・通知・バッチ・不正な転送を規約どおり処理する
          children:
          - type: 実装
            meaning: 機械インターフェースの規約処理
            path: crates/vtest-mcp/
            status: 旧モデル・未追随
          - type: VO
            id: VO-IFACE-JSON-RPC
            meaning: 要求・通知・バッチ・不正な転送の各入力を規約どおりに処理し、不正入力にはコード・メッセージ・候補を付したツールエラーを返せること。
            children:
            - type: テスト
              meaning: '入力: 不正な形式の要求。コード付きのツールエラー（可能なら候補つき）を返す必要がある（正常応答を返したら失敗）。'
              children:
              - type: テスト実装
                status: 未（#13 スコープ外）
        - type: 項目
          meaning: 長時間実行中もソース変更を再走査し古い合格を保持しない
          children:
          - type: 実装
            meaning: 実行中の再走査
            path: crates/vtest-mcp/
            status: 未
          - type: VO
            id: VO-IFACE-RESCAN
            meaning: 機械インターフェースの長時間実行中もソース変更を再走査し、古くなった合格を保持しないこと。
            children:
            - type: テスト
              meaning: '入力: サーバ実行中にソースを変更した後の再検証。更新時刻に基づき再走査し古い合格を返さない必要がある（変更前の合格を返したら失敗）。'
              children:
              - type: テスト実装
                status: 未（#13 スコープ外）
  - type: 要件
    id: 要件定義 §4.2
    meaning: 親を持たない文書ノードが存在するかを検査できること。根として指定された文書は対象外とする。
    children:
    - type: 基本仕様
      id: 基本仕様 §5.2
      meaning: 文書層の孤児検出を検査の1つとして持つ。設定で列挙した根を対象外とし、それ以外で親も参照も持たない文書を不一致とする。
      children:
      - type: 詳細仕様
        id: 詳細設計 別紙C §18.3.2／本冊 §5.6
        meaning: 導出元が空でどの文書からも参照されず根にも挙げられない文書を孤児として不一致とし、存在しない根を指す設定を設定違反とする規則。
        children:
        - type: 項目
          meaning: 親も参照も無く根にも列挙されない文書がある
          children:
          - type: 実装
            meaning: 孤児文書の判定
            path: crates/vtest-scan/
            status: 未
          - type: VO
            id: VO-ORPHAN-01
            meaning: 導出元が空でどの文書からも参照されず根にも列挙されない文書を、孤児として不一致と判定できること。
            children:
            - type: テスト
              meaning: '入力: 導出元が空でどこからも参照されず根指定も無い文書。孤児検出が不一致を返す必要がある（それ以外なら失敗）。'
              children:
              - type: テスト実装
                status: 未（#13 スコープ外）
        - type: 項目
          meaning: 根として列挙された文書は対象外
          children:
          - type: 実装
            meaning: 根文書の除外
            path: crates/vtest-scan/
            status: 未
          - type: VO
            id: VO-ORPHAN-02
            meaning: 設定の根として列挙された文書を孤児検出の対象外にできること。
            children:
            - type: テスト
              meaning: '入力: 導出元は空だが根として列挙された文書。孤児検出が対象外として不一致にしない必要がある（不一致にしたら失敗）。'
              children:
              - type: テスト実装
                status: 未（#13 スコープ外）
        - type: 項目
          meaning: 存在しない文書を根に指定している
          children:
          - type: 実装
            meaning: 根指定の妥当性検査
            path: crates/vtest-scan/
            status: 未
          - type: VO
            id: VO-ORPHAN-04
            meaning: 存在しない文書を根に指定した設定を、設定違反と判定できること。
            children:
            - type: テスト
              meaning: '入力: 実在しない文書識別子を根に列挙した設定。設定違反を返す必要がある（そのまま受理したら失敗）。'
              children:
              - type: テスト実装
                status: 未（#13 スコープ外）
  - type: 要件
    id: 要件定義 §3.2／§3.4
    meaning: 上流文書はすべて単一の総称ノードで表し、文書から義務へ導出で直結させること。文書層の段はリンクであって検査を増やさず、性質の異なる関係型は区別する。
    children:
    - type: 基本仕様
      id: 基本仕様 §3.1／§3.2／§2.3
      meaning: 文書種別ごとの専用スキーマを持たず総称ノードで扱い、導出できる関係は保存しない。リンクの説明文は任意で空でも不一致にしない。
      children:
      - type: 詳細仕様
        id: 詳細設計 本冊 §3.1／§3.2／§5.3
        meaning: 総称文書レコードの構造、文書から義務への直結、性質の異なる関係型の区別、リンク説明文の任意保持、段を追加してもスキーマを壊さない設計。
        children:
        - type: 項目
          meaning: 文書は識別子・パス・内容ハッシュ・導出元を持つ単一の総称ノードで種別専用スキーマを持たない
          children:
          - type: 実装
            meaning: 総称文書レコード
            path: crates/vtest-model/
            status: 未
          - type: VO
            id: VO-DOCMODEL-01
            meaning: 上流文書を種別ごとの専用スキーマを設けず単一の総称ノードとして扱えること。
            children:
            - type: テスト
              meaning: '入力: 要件定義と基本仕様など種別の異なる文書群。いずれも同一の総称文書として登録され種別で分岐しない必要がある（種別専用スキーマを要求したら失敗）。'
              children:
              - type: テスト実装
                status: 未（#13 スコープ外）
        - type: 項目
          meaning: 義務は1件以上の文書から直接導出され間に他の層を置かない
          children:
          - type: 実装
            meaning: 文書から義務への直結
            path: crates/vtest-model/
            status: 未
          - type: VO
            id: VO-DOCMODEL-02
            meaning: 義務を1件以上の文書から導出で直結させ、文書と義務の間に他のエンティティ層を置かないこと。
            children:
            - type: テスト
              meaning: '入力: 文書から導出された義務。文書と義務の間に中間層が無く直結する必要がある（中間層を要求したら失敗）。'
              children:
              - type: テスト実装
                status: 未（#13 スコープ外）
        - type: 項目
          meaning: 導出・被覆・検証対象・実装追跡の関係型を単一へ潰さず区別する
          children:
          - type: 実装
            meaning: 関係型の区別
            path: crates/vtest-model/
            status: 未
          - type: VO
            id: VO-DOCMODEL-03
            meaning: 文書間の導出、義務からテストへの被覆、テストと実装の関係など、性質の異なる関係型を単一へ潰さず区別できること。
            children:
            - type: テスト
              meaning: '入力: 導出関係と被覆関係を持つグラフ。両者が別の関係型として区別される必要がある（同一種別へ潰したら失敗）。'
              children:
              - type: テスト実装
                status: 未（#13 スコープ外）
        - type: 項目
          meaning: リンクの説明文は任意で空でも不一致にしない
          children:
          - type: 実装
            meaning: リンク説明文の任意保持
            path: crates/vtest-store/
            status: 未
          - type: VO
            id: VO-DOCMODEL-04
            meaning: 関係リンクに付す説明文を任意とし、空でも宣言鎖の不一致にしないこと。
            children:
            - type: テスト
              meaning: '入力: 説明文が空の導出リンク。宣言鎖の検査が合格し不一致にしない必要がある（空を理由に不一致にしたら失敗）。'
              children:
              - type: テスト実装
                status: 未（#13 スコープ外）
        - type: 項目
          meaning: 文書層の段はリンクであり、段の追加でスキーマを壊さず検査を増やさない
          children:
          - type: 実装
            meaning: 段追加のスキーマ非破壊
            path: crates/vtest-model/
            status: 未
          - type: VO
            id: VO-DOCMODEL-05
            meaning: 文書層の段をリンクとして表し、段を追加してもスキーマを壊さず検査本数を増やさないこと。
            children:
            - type: テスト
              meaning: '入力: 文書層に新たな段を1つ追加した構成。スキーマが壊れず検査本数が増えない必要がある（スキーマ破壊や検査増加が起きたら失敗）。'
              children:
              - type: テスト実装
                status: 未（#13 スコープ外）
- type: 要求
  id: R-2
  label: スコープ防衛
  meaning: スコープを広げず、v0.1 は宣言された義務の裏付けの検証だけで出荷したい。
  children:
  - type: 要件
    id: 要件定義 R-2／§4.2
    meaning: 文書層の孤児検出だけを行い、宣言されていない実装の孤児検出（過実装検出）は v0.1 では行わないこと。
    children:
    - type: 基本仕様
      id: 基本仕様 §29（OOS-005）／§5.2
      meaning: 孤児検出の対象を文書層に限り、実装レイヤーの孤児検出はスコープ外とする。README にも非関知の宣言を入れる。
      children:
      - type: 詳細仕様
        id: 詳細設計 別紙C §18.3.2
        meaning: 孤児検出は文書層のみを対象とし、未宣言の実装が孤児として検出されないことを保証する規則。
        children:
        - type: 項目
          meaning: 実装レイヤーの孤児（宣言されていない実装）は検出しない
          children:
          - type: 実装
            meaning: 文書層限定の孤児検出
            path: crates/vtest-scan/
            status: 未
          - type: VO
            id: VO-ORPHAN-03
            meaning: 孤児検出の対象を文書層に限り、宣言されていない実装が孤児として検出されないことを保証できること。
            children:
            - type: テスト
              meaning: '入力: 宣言鎖に現れない未宣言の実装コード。孤児検出がそれを孤児として報告しない必要がある（実装を孤児検出したら失敗）。'
              children:
              - type: テスト実装
                status: 未（#13 スコープ外）
- type: 原則
  id: P-001
  label: 検証機であり決定機でない
  meaning: 本システムは不一致を検出して提示するだけで、どれを正とし何を直すべきかは決めない。
  children:
  - type: 要件
    id: 要件定義 §5.1／§5.2
    meaning: 検証状態は5つのみとし、状態の存在資格は受け取った者の行動が変わるかに置く。原因を説明する診断ラベルは状態とは別の軸とする。
    children:
    - type: 基本仕様
      id: 基本仕様 §4.1／§4.2
      meaning: 検証状態は5値、診断ラベルは4種で、ラベルは状態値には用いず併記のみとする。
      children:
      - type: 詳細仕様
        id: 詳細設計 別紙A §12.1／本冊 §5.2
        meaning: 検証結果を出力する全経路で、状態列と診断ラベル列を常に別軸の2列として提示する規則。
        children:
        - type: 項目
          meaning: 検証状態は合格・不合格・不一致・証拠なし・不明の5値のみ
          children:
          - type: 実装
            meaning: 5状態モデル
            path: crates/vtest-model/
            status: 未
          - type: VO
            id: VO-STATE-01
            meaning: 検証状態を合格・不合格・不一致・証拠なし・不明の5値のみに限れること。
            children:
            - type: テスト
              meaning: '入力: 5状態それぞれを生じる入力群。検証状態がこの5値のいずれかにだけ収まる必要がある（6値目が現れたら失敗）。'
              children:
              - type: テスト実装
                status: 未（#13 スコープ外）
        - type: 項目
          meaning: 診断ラベル4種は状態とは別軸で、状態値には用いず併記のみ
          children:
          - type: 実装
            meaning: 診断ラベルの別軸表現
            path: crates/vtest-model/
            status: 未
          - type: VO
            id: VO-STATE-02
            meaning: 欠落・未実行・未計測・鮮度喪失の4診断ラベルを状態とは別軸として扱い、状態値には用いず併記のみとできること。
            children:
            - type: テスト
              meaning: '入力: 診断ラベルを伴う非合格の検査結果。ラベルが状態値ではなく状態に併記される列として現れる必要がある（ラベルを状態値に入れたら失敗）。'
              children:
              - type: テスト実装
                status: 未（#13 スコープ外）
  - type: 要件
    id: 要件定義 §12／§8
    meaning: 機械が確定できない疑義は不明として外部の判断者へ渡し、その判断を対象の依存ハッシュとともに記録すること。判断の受理は検証状態を昇格させない。
    children:
    - type: 基本仕様
      id: 基本仕様 §11／§11.3
      meaning: 判断記録は誰が・何を・どう判断したかを必須とし理由は任意。判断の受理は検証状態を変えず、変更後は流用せず再検証する。
      children:
      - type: 詳細仕様
        id: 詳細設計 別紙C §18.3.6／本冊 §8
        meaning: 判断バンドルの生成と提出時の検証、判断記録の保存と依存閉包束縛、受理が状態を昇格させないこと、変更後の再検証の規則。
        children:
        - type: 項目
          meaning: 判断記録の受理は検証状態を昇格させない
          children:
          - type: 実装
            meaning: 判断受理の非昇格
            path: crates/vtest-audit/
            status: 未
          - type: VO
            id: VO-DECISION-NONGATE
            meaning: 判断記録を受理しても対象の検証状態を昇格させないこと（不明が合格へ変わらない）。
            children:
            - type: テスト
              meaning: '入力: 不明の対象に対する判断の受理。受理後も検証状態が不明のままである必要がある（合格へ昇格したら失敗）。'
              children:
              - type: テスト実装
                status: 未（#13 スコープ外）
        - type: 項目
          meaning: 提出はバンドル存在・対象一致・ハッシュ一致・受理判断値を検証する
          children:
          - type: 実装
            meaning: 判断提出の検証
            path: crates/vtest-audit/
            status: 旧モデル・未追随
          - type: VO
            id: VO-DECISION-SUBMIT
            meaning: 判断の提出時に、バンドルの存在・対象の一致・記録時ハッシュと現在の一致・判断値が受理値であることを順に検証できること。
            children:
            - type: テスト
              meaning: '入力: 記録時と現在でハッシュが食い違う対象への提出。提出が拒否される必要がある（受理したら失敗）。'
              children:
              - type: テスト実装
                status: 未（#13 スコープ外）
        - type: 項目
          meaning: actor・subject・decision は必須、理由は任意で空でも無効化しない
          children:
          - type: 実装
            meaning: 判断記録の必須項目と任意理由
            path: crates/vtest-audit/
            status: 未
          - type: VO
            id: VO-DECISION-REASON-OPT
            meaning: 判断記録が誰が・何を・どう判断したかを必須とし理由を任意として、理由が空であることだけを根拠に無効・不明・証拠なし・不一致として扱わないこと。
            children:
            - type: テスト
              meaning: '入力: 必須3項目を持ち理由が空の判断記録。有効な判断として受理される必要がある（理由が空を理由に無効化したら失敗）。'
              children:
              - type: テスト実装
                status: 未（#13 スコープ外）
        - type: 項目
          meaning: 受理判断は対象ハッシュと依存閉包へ束縛され変更で失効する
          children:
          - type: 実装
            meaning: 判断の依存閉包束縛
            path: crates/vtest-audit/
            status: 未
          - type: VO
            id: VO-DECISION-HASHBIND
            meaning: 受理された判断を対象ハッシュと依存閉包へ束縛し、対象や依存の変更（依存文書のハッシュ不一致を含む）で失効させられること。
            children:
            - type: テスト
              meaning: '入力: 判断後に依存文書が変更されハッシュが不一致になった状態。当該判断が失効する必要がある（有効なまま流用したら失敗）。'
              children:
              - type: テスト実装
                status: 未（#13 スコープ外）
        - type: 項目
          meaning: 変更後は判断を流用せず4検査を再実施する
          children:
          - type: 実装
            meaning: 変更後の再検証
            path: crates/vtest-verify/
            status: 未
          - type: VO
            id: VO-DECISION-REVERIFY
            meaning: 対象が変更された後は過去の判断を流用せず4検査を再実施し、結果が5状態のいずれにもなりうること（変更自体は不明を生成しない）。
            children:
            - type: テスト
              meaning: '入力: 判断済みの対象を変更した後の検証。判断を流用せず再検査した結果が返る必要がある（過去判断を流用して合格化したら失敗）。'
              children:
              - type: テスト実装
                status: 未（#13 スコープ外）
        - type: 項目
          meaning: バンドルは派生としてキャッシュへ出力し、対象を一意解決できなければ生成しない
          children:
          - type: 実装
            meaning: バンドルの派生出力と一意解決前提
            path: crates/vtest-audit/
            status: 旧モデル・未追随
          - type: VO
            id: VO-DECISION-BUNDLE
            meaning: 判断バンドルを派生情報としてキャッシュへ出力し（Git 管理外）、対象を一意に解決できなければ生成せず候補を選ばないこと。
            children:
            - type: テスト
              meaning: '入力: 対象が複数候補に曖昧化した状態でのバンドル生成要求。バンドルを生成せず候補を選ばない必要がある（候補を1件選んで生成したら失敗）。'
              children:
              - type: テスト実装
                status: 未（#13 スコープ外）
- type: 原則
  id: P-002
  label: Fail Closed
  meaning: 未検証を合格として扱わない。合格は要求した全検査が合格のときだけとする。
  children:
  - type: 要件
    id: 要件定義 §26.1／§26.3
    meaning: 完全検証の合格は要求した全検査が合格の場合に限り、1項目でも非合格なら不合格とすること。上位単位への集約は未検証を合格にしない。
    children:
    - type: 基本仕様
      id: 基本仕様 §22
      meaning: 完全検証は4検査すべてが合格の場合だけ合格とし、集約は子に1つでも非合格があれば親を非合格とする。代表値の優先順位を定め診断ラベルは順位に用いない。
      children:
      - type: 詳細仕様
        id: 詳細設計 別紙C §18.3.8／本冊 §11.3
        meaning: 木構造での非合格の伝播、代表値の優先順位、未登録テスト1件での総合不合格、非合格根拠への掘り下げの規則。
        children:
        - type: 項目
          meaning: 完全検証の合格は4検査全合格かつ証拠が要件を満たす場合のみ
          children:
          - type: 実装
            meaning: 完全検証の合格条件
            path: crates/vtest-verify/
            status: 旧モデル・未追随
          - type: VO
            id: VO-AGG-FAILCLOSED
            meaning: 完全検証の合格を、4検査すべてが合格でかつ証拠が要件を満たす場合のみとし、1項目でも非合格なら不合格にできること。
            children:
            - type: テスト
              meaning: '入力: 3検査が合格で1検査が不合格の対象。総合が不合格になる必要がある（合格にしたら失敗）。'
              children:
              - type: テスト実装
                status: 未（#13 スコープ外）
        - type: 項目
          meaning: テスト単位の結果を義務・機能・文書単位へ非合格優先で集約する
          children:
          - type: 実装
            meaning: 非合格優先の木集約
            path: crates/vtest-verify/
            status: 旧モデル・未追随
          - type: VO
            id: VO-AGG-TREE
            meaning: テスト単位の結果を義務・機能・文書単位へ集約し、子に1つでも非合格があれば親を非合格にできること。
            children:
            - type: テスト
              meaning: '入力: 子の1つが不合格の義務。義務単位の集約が不合格になる必要がある（合格にしたら失敗）。'
              children:
              - type: テスト実装
                status: 未（#13 スコープ外）
        - type: 項目
          meaning: 代表値の優先順位は不合格・不一致・証拠なし・不明の順で診断ラベルは順位に用いない
          children:
          - type: 実装
            meaning: 代表値の優先順位
            path: crates/vtest-verify/
            status: 旧モデル・未追随
          - type: VO
            id: VO-AGG-PRIORITY
            meaning: 集約の代表値の優先順位を不合格・不一致・証拠なし・不明の順とし、診断ラベルを順位に用いず併記できること。
            children:
            - type: テスト
              meaning: '入力: 不一致と不明が混在する子を持つ親。代表値が不一致になる必要がある（不明を代表にしたら失敗）。'
              children:
              - type: テスト実装
                status: 未（#13 スコープ外）
        - type: 項目
          meaning: 他検査が全合格でも未登録テスト1件で総合不合格
          children:
          - type: 実装
            meaning: 未登録テストによる総合不合格
            path: crates/vtest-verify/
            status: 旧モデル・未追随
          - type: VO
            id: VO-AGG-UNREG-NG
            meaning: 管理側の他検査がすべて合格でも、未登録テストが1件あれば宣言鎖の完全性により総合を不合格にできること。
            children:
            - type: テスト
              meaning: '入力: 他は全合格だが未登録テストが1件ある状態。総合が不合格になる必要がある（合格にしたら失敗）。'
              children:
              - type: テスト実装
                status: 未（#13 スコープ外）
        - type: 項目
          meaning: 不合格時にどのエンティティ・検査・状態・診断で落ちたか掘り下げられる
          children:
          - type: 実装
            meaning: 非合格根拠の掘り下げ
            path: crates/vtest-verify/
            status: 旧モデル・未追随
          - type: VO
            id: VO-AGG-DRILLDOWN
            meaning: 不合格のとき、どのエンティティのどの検査がどの状態と診断ラベルで落ちたかを掘り下げて辿れ、文字と機械可読の両形式で出力できること。
            children:
            - type: テスト
              meaning: '入力: 複数箇所で非合格が生じた検証。落ちた箇所を検査・状態・診断まで辿れる根拠が両形式で返る必要がある（根拠を辿れなければ失敗）。'
              children:
              - type: テスト実装
                status: 未（#13 スコープ外）
  - type: 要件
    id: 要件定義 §4.3／§5.3／P-002
    meaning: 検証スコープを限定できるが、実施しなかった検査を合格へ変えてはならないこと。
    children:
    - type: 基本仕様
      id: 基本仕様 §4.6
      meaning: スコープは検査軸とエンティティ軸の2軸で限定でき、スコープ外・未実施は証拠なしとして保持し合格化しない。いかなる設定も完全検証を4検査未満へ縮退させない。
      children:
      - type: 詳細仕様
        id: 詳細設計 別紙C §18.3.8／本冊 §2.2
        meaning: 2軸のスコープ限定、旧来の項目列挙の拒否、限定時の要求スコープ併記、表示スコープと内部依存評価の分離の規則。
        children:
        - type: 項目
          meaning: 検査軸とエンティティ軸の2軸でスコープを限定できる
          children:
          - type: 実装
            meaning: スコープの2軸限定
            path: crates/vtest-verify/
            status: 旧モデル・未追随
          - type: VO
            id: VO-SCOPE-2AXIS
            meaning: 検査の部分集合と対象の部分木という2軸でスコープを限定できること。
            children:
            - type: テスト
              meaning: '入力: 特定の検査1本かつ特定の文書部分木への限定指定。その2軸で限定された結果が返る必要がある（限定が効かなければ失敗）。'
              children:
              - type: テスト実装
                status: 未（#13 スコープ外）
        - type: 項目
          meaning: スコープ外・未実施は証拠なしのまま保持し合格化しない
          children:
          - type: 実装
            meaning: スコープ外の非合格化保持
            path: crates/vtest-verify/
            status: 未
          - type: VO
            id: VO-SCOPE-NOPROMOTE
            meaning: スコープ外や未実施の項目を証拠なし（未計測）として保持し合格へ変えず、要求スコープと未検証範囲を併記できること。
            children:
            - type: テスト
              meaning: '入力: 一部検査を除外した限定スコープ検証。除外項目が証拠なし（未計測）で保持され合格化しない必要がある（合格化したら失敗）。'
              children:
              - type: テスト実装
                status: 未（#13 スコープ外）
        - type: 項目
          meaning: いかなる設定値も完全検証を4検査未満へ縮退させない
          children:
          - type: 実装
            meaning: 完全検証の非縮退
            path: crates/vtest-verify/
            status: 未
          - type: VO
            id: VO-SCOPE-NODEGRADE
            meaning: いかなる設定値によっても完全検証を4検査未満へ縮退させず、検査指定の省略時は固定4検査とすること。
            children:
            - type: テスト
              meaning: '入力: 検査指定を省略した検証。固定の4検査すべてが実行される必要がある（4本未満に縮退したら失敗）。'
              children:
              - type: テスト実装
                status: 未（#13 スコープ外）
        - type: 項目
          meaning: 旧来の項目列挙は設定違反で、欠落のみ固定4検査へ具体化する
          children:
          - type: 実装
            meaning: 旧項目列挙の拒否
            path: crates/vtest-verify/
            status: 未
          - type: VO
            id: VO-SCOPE-FULLSCOPE-INV
            meaning: 旧来の項目列挙をバージョンによらず設定違反とし、設定の欠落だけを固定4検査へ具体化（メモリ上の補完なし）できること。
            children:
            - type: テスト
              meaning: '入力: 旧来の項目列挙を含む設定。設定違反を返す必要がある（受理して部分検証したら失敗）。'
              children:
              - type: テスト実装
                status: 未（#13 スコープ外）
        - type: 項目
          meaning: 表示スコープと内部依存評価を分離する
          children:
          - type: 実装
            meaning: 表示スコープと内部依存の分離
            path: crates/vtest-verify/
            status: 未
          - type: VO
            id: VO-SCOPE-INTERNAL-DEP
            meaning: 表示するスコープと、判定に必要な内部依存の評価を分離し、限定スコープでも内部依存を評価しつつスコープ外の表示値は証拠なしに保てること。
            children:
            - type: テスト
              meaning: '入力: 検証対象実現だけへ限定したが判定に鮮度評価が要る検証。内部で依存を評価しつつスコープ外項目は証拠なしのまま表示する必要がある（スコープ外を合格表示したら失敗）。'
              children:
              - type: テスト実装
                status: 未（#13 スコープ外）
  - type: 要件
    id: 要件定義 §5.4
    meaning: 不明は正常動作としての降参でありエラーではない。内部エラーや入力不正は検証状態と別系統の終了コードで表すこと。
    children:
    - type: 基本仕様
      id: 基本仕様 §4.4／§26.1
      meaning: 不明をエラー処理のフォールバック先に使わない。操作拒否・検証不合格・内部エラーを終了コードで区別する。
      children:
      - type: 詳細仕様
        id: 詳細設計 本冊 §17.2／別紙A §12.1
        meaning: 診断コードの区分に応じた終了コードの割当と、不明を別系統に検疫する規則。
        children:
        - type: 項目
          meaning: 不明を正常動作の降参として扱いエラーのフォールバック先に使わない
          children:
          - type: 実装
            meaning: 不明の検疫
            path: crates/vtest-verify/
            status: 未
          - type: VO
            id: VO-EXIT-QUARANTINE
            meaning: 不明を正常動作としての降参として扱い、内部エラーや入力不正のフォールバック先に使わないこと。
            children:
            - type: テスト
              meaning: '入力: 内部エラーが起きた検証。検証状態を不明にせず終了コードで別系統に表す必要がある（内部エラーを不明にすり替えたら失敗）。'
              children:
              - type: テスト実装
                status: 未（#13 スコープ外）
        - type: 項目
          meaning: 終了コードは要求スコープ合格・検証不合格・操作拒否・内部エラーを区別する
          children:
          - type: 実装
            meaning: 終了コード体系
            path: crates/vtest-cli/
            status: 旧モデル・未追随
          - type: VO
            id: VO-EXIT-CODES
            meaning: 終了コードで要求スコープの合格・検証不合格・操作拒否・内部エラーを区別し、診断コードの区分を対応する終了コードへ写せること。
            children:
            - type: テスト
              meaning: '入力: アダプタや設定の拒否が生じた操作。操作拒否を表す終了コードが返る必要がある（検証不合格や合格のコードを返したら失敗）。'
              children:
              - type: テスト実装
                status: 未（#13 スコープ外）
- type: 原則
  id: P-003
  label: 単一の正典
  meaning: 同じ事実を複数箇所へ独立して記録せず、派生情報は正典から再構築できるようにする。
  children:
  - type: 要件
    id: 要件定義 §3.4／NFR-003／NFR-004
    meaning: 最小単位の上流から関係を経て下流へ至る組を任意ノードから取得でき、連続追跡と全体構造も辿れること。逆引きなどの派生インデックスは正典から再構築できること。
    children:
    - type: 基本仕様
      id: 基本仕様 §19
      meaning: 同一のトレース構造から役割や目的に応じて参照対象や粒度を変えた見え方を提示でき、役割を固定の列挙にしない。
      children:
      - type: 詳細仕様
        id: 詳細設計 本冊 §11.6／§5.3
        meaning: 任意ノードからの局所・経路・全体トレース、逆引きインデックスの正典からの再構築、役割別の見え方の提示の規則。
        children:
        - type: 項目
          meaning: 任意ノードから上流・下流へ辿り全体構造も取得できる
          children:
          - type: 実装
            meaning: 任意ノードからのトレース
            path: crates/vtest-verify/
            status: 未
          - type: VO
            id: VO-TRACE-ANYNODE
            meaning: 最小単位の上流から関係を経て下流へ至る組を任意のノードから取得でき、連続して遡行・下降し全体構造も取得できること（常時の全チェーン表示は求めない）。
            children:
            - type: テスト
              meaning: '入力: あるテストのノードを起点にした上流トレース要求。そのノードから上流の義務・文書まで辿れる必要がある（辿れなければ失敗）。'
              children:
              - type: テスト実装
                status: 未（#13 スコープ外）
        - type: 項目
          meaning: 逆引きインデックスを正典から再構築する派生とする
          children:
          - type: 実装
            meaning: 逆引きの正典再構築
            path: crates/vtest-verify/
            status: 未
          - type: VO
            id: VO-TRACE-INDEX
            meaning: 義務からテスト・実装対象からテスト・文書から義務・文書から文書などの逆引きを正典から再構築できる派生として持てること。
            children:
            - type: テスト
              meaning: '入力: 正典レコードだけがある状態での逆引き要求。逆引きインデックスが正典から再構築されて返る必要がある（別途手動同期が要るなら失敗）。'
              children:
              - type: テスト実装
                status: 未（#13 スコープ外）
        - type: 項目
          meaning: 同一構造から役割別の見え方を粒度を変えて取得する
          children:
          - type: 実装
            meaning: 役割別の見え方
            path: crates/vtest-verify/
            status: 未
          - type: VO
            id: VO-TRACE-PROJECTION
            meaning: 同一のトレース構造から役割別の見え方を粒度を変えて取得でき、役割を固定の列挙にしないこと。
            children:
            - type: テスト
              meaning: '入力: 同一構造に対する異なる役割の見え方要求。役割ごとに参照対象と粒度を変えた見え方が同一構造から返る必要がある（役割が固定列挙に縛られたら失敗）。'
              children:
              - type: テスト実装
                status: 未（#13 スコープ外）
- type: 要求
  id: R-3
  label: 言語・ツール非依存
  meaning: 言語にもテストツールにも依存せず、言語とツールを拡張できるようにする。
  children:
  - type: 要件
    id: 要件定義 §21／§9.2／§27
    meaning: 検証契約・識別子・ハッシュ・証拠・状態・集約の概念は言語とランナーに依存せず、中核を変えずに別アダプタを登録できること。検証対象の識別に特定言語の構造を必須としない。
    children:
    - type: 基本仕様
      id: 基本仕様 §27／§2.4／§9.2
      meaning: 検証契約はアダプタ非依存で、テストは関数ではなく実行記述子で表す。設定は新旧を読めて書き出しは新形式、対象参照は正規化した一意な位置で確定する。
      children:
      - type: 詳細仕様
        id: 詳細設計 別紙C §18.3.12／§18.3.1／本冊 §6.1.1
        meaning: アダプタ契約の言語非依存性、別アダプタ登録と重複拒否、設定と出力の互換、決定論的統合、検証対象の一方向確定と一意識別、恒久識別子の全体一意性の規則。
        children:
        - type: 項目
          meaning: 検証契約・識別子・ハッシュ・証拠・状態・集約は言語とランナーに依存しない
          children:
          - type: 実装
            meaning: アダプタ非依存の検証契約
            path: crates/vtest-adapter-api/
            status: 未
          - type: VO
            id: VO-ADAPTER-NEUTRAL
            meaning: 検証契約・識別子・ハッシュ・証拠・状態・集約を言語とランナーに依存させず、テストを関数ではなく実行記述子だけで表せること。
            children:
            - type: テスト
              meaning: '入力: Rust 以外の合成アダプタで登録したテスト。中核を変えずに検証契約が成立する必要がある（言語固有型を要求したら失敗）。'
              children:
              - type: テスト実装
                status: 未（#13 スコープ外）
        - type: 項目
          meaning: 中核を変えず別アダプタを登録でき、重複や不整合を拒否する
          children:
          - type: 実装
            meaning: アダプタ登録と重複拒否
            path: crates/vtest-adapter-api/
            status: 未
          - type: VO
            id: VO-ADAPTER-REGISTER
            meaning: 中核を変えずに別アダプタを登録でき、識別子の重複・未登録・宣言能力と実装の不一致・アダプタ間のテスト識別子重複を拒否できること。
            children:
            - type: テスト
              meaning: '入力: 既存と重複する識別子を持つアダプタの登録。登録が拒否される必要がある（受理したら失敗）。'
              children:
              - type: テスト実装
                status: 未（#13 スコープ外）
        - type: 項目
          meaning: 未登録・能力不足・解析不能で合格へ昇格させない
          children:
          - type: 実装
            meaning: 能力不足の非昇格
            path: crates/vtest-adapter-api/
            status: 未
          - type: VO
            id: VO-ADAPTER-NOPROMOTE
            meaning: アダプタが未登録・能力不足・解析不能の場合に検証結果を推測で合格へ昇格させないこと。
            children:
            - type: テスト
              meaning: '入力: 必須能力を欠くアダプタでの検証。合格へ昇格させず非合格を返す必要がある（合格化したら失敗）。'
              children:
              - type: テスト実装
                status: 未（#13 スコープ外）
        - type: 項目
          meaning: 設定は新旧を読め書き出しは新形式、テスト出力の互換フィールドと単数互換を規定通り扱う
          children:
          - type: 実装
            meaning: 設定と出力の互換
            path: crates/vtest-store/
            status: 未
          - type: VO
            id: VO-ADAPTER-WIRE
            meaning: 設定の新旧両形式を読み取り書き換えずに受理し、書き出しと初期化は新形式とし、テスト出力は実行座標を常に持ち特定アダプタのみ互換フィールドを追加し、対象は常に一覧で単数互換は1件時のみとできること。
            children:
            - type: テスト
              meaning: '入力: 旧形式の設定ファイル。読み取りで書き換えずに受理する必要がある（読み取りで書き換えたら失敗）。'
              children:
              - type: テスト実装
                status: 未（#13 スコープ外）
        - type: 項目
          meaning: アダプタ結果を決定論的に統合し全体でテスト識別子の一意性を検査する
          children:
          - type: 実装
            meaning: アダプタ結果の決定論的統合
            path: crates/vtest-scan/
            status: 未
          - type: VO
            id: VO-ADAPTER-MERGE
            meaning: 複数アダプタの結果を決定論的に統合し、同一の根を共有できる一方で同一アダプタ内の根重複を拒否し、統合後の全体でテスト識別子の大局的一意性を検査できること。
            children:
            - type: テスト
              meaning: '入力: 2つのアダプタが同一のテスト識別子を返す状態。統合後に一意性違反として検出される必要がある（見逃したら失敗）。'
              children:
              - type: テスト実装
                status: 未（#13 スコープ外）
        - type: 項目
          meaning: 検証対象は正規化位置と任意の恒久識別子を併有する単一実体で複数対象を縮約しない
          children:
          - type: 実装
            meaning: 検証対象の単一実体識別
            path: crates/vtest-adapter-api/
            status: 未
          - type: VO
            id: VO-ADAPTER-SRC-IDENT
            meaning: 検証対象を正規化した位置と任意の恒久識別子を併せ持つ単一の実体として識別し、複数対象を独立に保ち代表1件へ縮約せず、テストと対象を双方向に辿れること。
            children:
            - type: テスト
              meaning: '入力: 2つの対象を宣言したテスト。両対象が独立に識別され1件へ縮約されない必要がある（縮約したら失敗）。'
              children:
              - type: テスト実装
                status: 未（#13 スコープ外）
        - type: 項目
          meaning: 恒久識別子を持つ対象は位置でも参照でき両方式で同一の識別に解決する
          children:
          - type: 実装
            meaning: 位置と恒久識別子の同一解決
            path: crates/vtest-adapter-api/
            status: 未
          - type: VO
            id: VO-ADAPTER-SRC-DUAL
            meaning: 恒久識別子を持つ対象を位置でも参照でき、両方式が同一の内容ハッシュと同一の識別へ解決すること。
            children:
            - type: テスト
              meaning: '入力: 同一対象を位置と恒久識別子の両方で参照する2テスト。両者が同一の対象識別と同一ハッシュへ解決する必要がある（別実体に分裂したら失敗）。'
              children:
              - type: テスト実装
                status: 未（#13 スコープ外）
        - type: 項目
          meaning: 識別は宣言参照から解決を経て正規化位置へ一方向で確定し証拠は解決後を記録する
          children:
          - type: 実装
            meaning: 正規化位置への一方向確定
            path: crates/vtest-adapter-api/
            status: 未
          - type: VO
            id: VO-ADAPTER-SRC-CANON
            meaning: 識別を宣言された参照から解決を経て正規化位置へ一方向で確定させ、証拠や判断記録は解決後の正規化位置を記録し、綴りの異なる複数対象が同一へ解決する状態を不一致として検出できること。
            children:
            - type: テスト
              meaning: '入力: 綴りの異なる2つの対象宣言が同一の正規化位置へ解決する状態。不一致として検出される必要がある（見逃したら失敗）。'
              children:
              - type: テスト実装
                status: 未（#13 スコープ外）
        - type: 項目
          meaning: 解決は解決済・対象なし・曖昧を区別し曖昧は候補を選ばず終端する
          children:
          - type: 実装
            meaning: 対象解決の曖昧終端
            path: crates/vtest-adapter-api/
            status: 未
          - type: VO
            id: VO-ADAPTER-SRC-RESOLVE
            meaning: 対象参照の解決を解決済・対象なし・曖昧に区別し、曖昧は候補を解決結果に記録せず診断表示のみで終端させ、中核の単一経路が所有すること。
            children:
            - type: テスト
              meaning: '入力: 複数候補により曖昧な対象参照。候補を1件選ばず曖昧のまま終端する必要がある（候補を選んで解決したら失敗）。'
              children:
              - type: テスト実装
                status: 未（#13 スコープ外）
        - type: 項目
          meaning: 恒久識別子は全アダプタ統合後にリポジトリ全体で一意で衝突を拒否する
          children:
          - type: 実装
            meaning: 恒久識別子の全体一意性
            path: crates/vtest-adapter-api/
            status: 未
          - type: VO
            id: VO-ADAPTER-SRC-UNIQ
            meaning: 恒久識別子を全アダプタ統合後のリポジトリ全体で一意とし、衝突を拒否しつつ、衝突しても各対象は正規化位置で独立に具体化できること。
            children:
            - type: テスト
              meaning: '入力: 複数アダプタが同一の恒久識別子を宣言する状態。衝突として拒否される必要がある（受理したら失敗）。'
              children:
              - type: テスト実装
                status: 未（#13 スコープ外）
- type: 要求
  id: R-5
  label: 途中導入
  meaning: 開始時からの導入を前提とせず、既存・開発途中のプロジェクトへ後から導入できる。
  children:
  - type: 要件
    id: 要件定義 §17／§17.1／§17.3
    meaning: 既に大量のソースとテストがあるプロジェクトを検証対象として扱え、未登録テストや未確定の義務や未実施の検査を検証済みとして扱わないこと。判断待ち情報を機械可読に保持すること。
    children:
    - type: 基本仕様
      id: 基本仕様 §18
      meaning: 既存資産を読み取り状態を可視化し、初期化で既存コードを改変しない。未確定・不整合・未検証・要判断の事項を機械可読な構造として保持・取得できる。
      children:
      - type: 詳細仕様
        id: 詳細設計 本冊 §11.7／別紙A §12.4
        meaning: 既存資産の可視化、初期化での非改変、判断待ち情報を検証出力の横断集約セクションとして提示する規則。
        children:
        - type: 項目
          meaning: 既存の大量コードとテストを対象にでき未確定を検証済み扱いしない
          children:
          - type: 実装
            meaning: 既存資産の可視化
            path: crates/vtest-verify/
            status: 旧モデル・未追随
          - type: VO
            id: VO-ONBOARD-VISUALIZE
            meaning: 既に大量のコードとテストがあるプロジェクトを検証対象にでき、未登録テスト・欠落宣言・未確定の義務・未実施の検査を検証済みとして扱わないこと。
            children:
            - type: テスト
              meaning: '入力: 未登録テストと未確定の義務を含む既存プロジェクト。それらを検証済みとせず該当状態で提示する必要がある（検証済み扱いしたら失敗）。'
              children:
              - type: テスト実装
                status: 未（#13 スコープ外）
        - type: 項目
          meaning: 初期化は作業ディレクトリを作り既存コードを改変しない
          children:
          - type: 実装
            meaning: 初期化の非改変
            path: crates/vtest-cli/
            status: 旧モデル・未追随
          - type: VO
            id: VO-ONBOARD-INIT
            meaning: 初期化が検証用ディレクトリを作成して既存コードを改変せず、一部が欠落した状態でも読み取れること。
            children:
            - type: テスト
              meaning: '入力: 既存コードのあるプロジェクトでの初期化。検証用ディレクトリだけを作り既存コードを変更しない必要がある（既存コードを改変したら失敗）。'
              children:
              - type: テスト実装
                status: 未（#13 スコープ外）
        - type: 項目
          meaning: 判断待ち情報を機械可読構造として検証出力へ横断集約する
          children:
          - type: 実装
            meaning: 判断待ち情報の構造化
            path: crates/vtest-verify/
            status: 未
          - type: VO
            id: VO-ONBOARD-PENDING
            meaning: 判断待ちの情報を対象・種別・関係する検査・根拠・バンドル参照からなる機械可読構造として、検証と報告の出力へ横断的に集約できること。
            children:
            - type: テスト
              meaning: '入力: 不明や承認待ちが複数生じた検証。判断待ち情報が機械可読の横断集約として出力に含まれる必要がある（集約が無ければ失敗）。'
              children:
              - type: テスト実装
                status: 未（#13 スコープ外）
- type: 原則
  id: P-004
  label: Agent Form Engineering
  meaning: 既知の手順と入力項目を持つ操作は、自由記述でなく構造化した質問・入力・検証で扱う。
  children:
  - type: 要件
    id: 要件定義 §16／§15
    meaning: テスト操作の公式経路として構造化操作を提供し、変更時に既知項目を構造化入力してその場で検証すること。1操作の対象は原則1テストとし、通常ソースやヘルパの編集はテスト編集の責務としない。
    children:
    - type: 基本仕様
      id: 基本仕様 §15
      meaning: 望ましい状態方式で作成・編集し、入力を受理時に検証する。編集は対象テストの範囲だけを単一置換し、再適用は冪等とする。フォームは全体で一意の種別と所有アダプタを持つ。
      children:
      - type: 詳細仕様
        id: 詳細設計 別紙C §18.3.10／別紙A §15
        meaning: 望ましい状態からの差分適用と再走査検証、1テスト境界の前後二重検査、構造化入力の受理時検証、フォーム種別の一意解決、ヘルパ等の編集手段を提供しないことの規則。
        children:
        - type: 項目
          meaning: 作成・編集は望ましい状態方式で差分適用し再走査で検証し再適用は冪等
          children:
          - type: 実装
            meaning: 望ましい状態方式の編集
            path: crates/vtest-store/
            status: 旧モデル・未追随
          - type: VO
            id: VO-STO-DESIRED
            meaning: 作成と編集を望ましい状態方式とし、アダプタが差分を計算し中核が再走査で検証し、同じ望ましい状態の再適用が冪等になること。
            children:
            - type: テスト
              meaning: '入力: 同じ望ましい状態を2回適用する編集。2回目が何も変えず冪等になる必要がある（差分が生じたら失敗）。'
              children:
              - type: テスト実装
                status: 未（#13 スコープ外）
        - type: 項目
          meaning: 編集の対象は原則1テストで拡張範囲の単一置換により他へ波及しない
          children:
          - type: 実装
            meaning: 1テスト境界の保証
            path: crates/vtest-store/
            status: 旧モデル・未追随
          - type: VO
            id: VO-STO-1TEST
            meaning: 編集の一回の対象を原則1テストとし、その拡張範囲の単一置換で他のテストや通常ソースを変えないことを前後の二重検査で保証できること。
            children:
            - type: テスト
              meaning: '入力: あるテストの編集。他のテストや通常ソースが変化しない必要がある（他へ波及したら失敗）。'
              children:
              - type: テスト実装
                status: 未（#13 スコープ外）
        - type: 項目
          meaning: 構造化入力を受理時に検証し不在の参照は候補を提示する
          children:
          - type: 実装
            meaning: 構造化入力の受理時検証
            path: crates/vtest-store/
            status: 旧モデル・未追随
          - type: VO
            id: VO-STO-INPUT-VALIDATE
            meaning: 構造化入力を受理時に検証し、対象シンボルやテスト識別子や参照する義務の不在では候補を提示し、フォームの必須値と未知フィールドを常に検証できること。
            children:
            - type: テスト
              meaning: '入力: 存在しない義務を参照する回答。受理を拒否し候補を提示する必要がある（そのまま受理したら失敗）。'
              children:
              - type: テスト実装
                status: 未（#13 スコープ外）
        - type: 項目
          meaning: フォーム種別は全体で一意かつ所有アダプタを持ち一意解決時のみ操作を許す
          children:
          - type: 実装
            meaning: フォーム種別の一意解決
            path: crates/vtest-store/
            status: 未
          - type: VO
            id: VO-STO-FORM-RESOLVE
            meaning: フォーム種別をリポジトリ全体で一意とし所有アダプタを別に宣言させ、種別と所有と能力が一意に一致する場合のみ作成・取得を許し、重複・未知・曖昧・能力欠如を拒否しファイルを変えないこと。
            children:
            - type: テスト
              meaning: '入力: 同じ種別を複数アダプタが宣言する状態での作成要求。操作を拒否しファイルを変更しない必要がある（受理したら失敗）。'
              children:
              - type: テスト実装
                status: 未（#13 スコープ外）
        - type: 項目
          meaning: ヘルパ・フィクスチャ・通常ソースの編集手段は提供しない
          children:
          - type: 実装
            meaning: ヘルパ編集の非提供
            path: crates/vtest-store/
            status: 未
          - type: VO
            id: VO-STO-HELPER-OOS
            meaning: ヘルパ・フィクスチャ・通常ソースの編集手段をテスト操作として提供しないこと。
            children:
            - type: テスト
              meaning: '入力: ヘルパの編集を求める操作要求。テスト操作としては提供せず対象外とする必要がある（テスト操作で編集できたら失敗）。'
              children:
              - type: テスト実装
                status: 未（#13 スコープ外）
