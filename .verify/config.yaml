version: 2
project:
  name: SpecTracer
adapters:
  - id: rust-cargo
    roots:
      - '.'
    scan:
      include:
        - crates
      assertion_macros: []
    run:
      coverage: llvm-cov
verify:
  full_scope:
    - chain_integrity
    - orphan_detection
    - target_binding
    - oracle_presence
