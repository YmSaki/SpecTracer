kind: rust-integration
title: Rust integration test
fields:
  - name: targets
    question: Target source symbols?
    type: symbol-list
    required: true
    validate: [symbols-exist]
  - name: covers
    question: Verification objectives?
    type: vo-ref-list
    required: true
    validate: [vo-exists]
  - name: behavior
    question: Behavior under test?
    type: string
    required: true
  - name: test_kind
    question: Test kind?
    type: enum
    options: [normal, error, boundary, regression]
    required: true
  - name: input
    question: Input conditions?
    type: string
    required: true
  - name: expect
    question: Expected result?
    type: string
    required: true
    validate: [enum-variant-exists]
  - name: fn_name
    question: Test function name?
    type: ident
    required: true
    validate: [unique-fn-name]
  - name: file
    question: Destination Rust file?
    type: path
    required: true
    validate: [rust-file]
template: |
  /// @vtest.id {test_id}
  /// @vtest.covers {covers}
  /// @vtest.target {targets}
  /// @vtest.intent {behavior}
  /// @vtest.input {input}
  /// @vtest.expect {expect}
  /// @vtest.kind integration-{test_kind}
  #[test]
  fn {fn_name}() {
      todo!("implement test body")
  }
