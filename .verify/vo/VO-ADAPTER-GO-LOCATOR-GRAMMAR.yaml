claim: '`go`のlocatorの文法は、関数では`path "::" name`、メソッドでは`path "::" receiver-type "::" name`である。pathはプロジェクトルートからの相対パス（`/`区切り、`.go`で終わる）であり、receiver-typeはレシーバの型名からポインタの`*`と型引数を除いたものである。locatorは行番号・byte位置・走査順に依存させない。'
