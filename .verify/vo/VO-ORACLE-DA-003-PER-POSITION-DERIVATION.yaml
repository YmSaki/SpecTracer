claim: '`rust-cargo`で、タプル・配列（`vec![..]`を含む）・参照・構造体リテラルの構築式と、構築子であることを構文から確定できる列挙子・タプル構造体の構築（DS-1960）の値は、構成要素の位置ごとに派生かどうかを持ち、列挙子の別（どの列挙子か）は派生としない（位置ごとの派生を持たない派生した値（target呼出の戻り値など）の列挙子の別は派生として扱う）。その値を束縛した変数も同じとし、位置ごとの派生を持たない値（target呼出の戻り値など）は、すべての位置が同じ派生を持つものとして扱う。パターン（`let`のパターンを含む）の束縛と、フィールドアクセス・添字による読出しは、取り出す位置が派生であるときに限り派生とする。取り出す位置を構文から確定できない束縛と読出し（関数呼出で包んだ値からの束縛、整数リテラルでない添字による読出しを含む）は、値のすべての位置が派生であれば派生、どの位置も派生でなければ派生でないものとし、それ以外はUNKNOWNとする。位置ごとに派生が異なる値（列挙子の別を含む）を受け手とするメソッドチェーン（DS-1937）の値も、DS-1964による場合を除き、同じく扱う。'
