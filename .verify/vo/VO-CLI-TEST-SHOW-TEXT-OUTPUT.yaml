claim: '`vtest test show` の `--format text` は、当該 Test の Test ID、intent、`covers` の各 VO ID、各 target 参照、path、locator、`data.verification` が持つ検査ごとの検査名と state、`data.judgments` の要素ごとの `judgment_kind`・実効判断（未確定の場合は `UNKNOWN`）・`effective` の各 decision ID、`data.evidence` の Evidence ID と `result` を標準出力へ出力し、`data.evidence` が `null` の場合は `evidence: none` の行を出力し、終了コードは `--format json` と同じである。'
