claim: DA-001で、失敗として発散する構文（`rust-cargo`ではDS-1951）の定数性は、そのメッセージ引数ではなく、その構文が実行されるかどうかを決める位置（DS-1947）で判定する。決める位置が1つも無い構文（反駁不能なパターン（`rust-cargo`ではDS-1952）だけの腕にあり、支配する条件式とガードが無いものを含む）と、決める位置がすべてDA-001の定数判定で確定する構文は、定数アサーションとする。
