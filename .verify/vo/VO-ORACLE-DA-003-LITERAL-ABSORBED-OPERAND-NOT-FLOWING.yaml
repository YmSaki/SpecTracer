claim: 'DA-003で、演算の結果が真偽値になる言語と演算子（`rust-cargo`の`||`・`&&`・`|`・`&`、`go`の`||`・`&&`）について、リテラルに吸収されるオペランドの位置（`X || true`、`true || X`、`X && false`、`false && X`、`X | true`、`true | X`、`X & false`、`false & X`の`X`）は、値が流れる位置に数えない。`javascript`の`||`・`&&`・`|`・`&`は、演算の結果が真偽値にならないため対象としない。'
