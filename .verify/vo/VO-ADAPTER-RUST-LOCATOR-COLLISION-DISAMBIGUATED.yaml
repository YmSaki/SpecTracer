claim: item-pathはadapterが定める構文上の対象識別子とする。Rustアイテムパス（"::" 区切り、implブロック内の関数は"型名::関数名"）で対象が一意に定まる場合はその形式を維持する。同一path内でこの形式が衝突する場合は、trait・型・cfg条件およびそれらを継承する構文文脈で区別する。識別子は行番号・byte位置・走査順に依存させず、Cargoの実行selectorとは別に保持する。
