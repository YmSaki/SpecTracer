claim: '`case-coverage` の実効判断が `accepted` である Test について、`vtest verify --test <Test ID> --format json` の `data.pending` は当該 Test の `case-coverage` の項目を含まず、`vtest test show <Test ID> --format json` の `data.judgments` は、`judgment_kind` が `case-coverage`、`decision` が `accepted`、`effective` が当該判断記録の decision ID の1件だけ、`superseded` と `invalid` が空の list である要素を含む。'
