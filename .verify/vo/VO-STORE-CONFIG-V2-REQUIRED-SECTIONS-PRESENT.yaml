claim: >-
  導出。BD-154「`config.yaml` writerの正規形はversion 2とし、adapterごとにroot・scan・run設定を
  namespace化する」が定める version 2 の形は `project` / `adapters` / `verify` の各セクションを
  前提としており、DS-1662が config field 型が現在の config invariant に違反する場合を
  `E-CONFIG-001` とすることと合わせると、version 2 config でこれらのセクションのいずれかが
  欠けている場合は `E-CONFIG-001` として fail closed でなければならない。
