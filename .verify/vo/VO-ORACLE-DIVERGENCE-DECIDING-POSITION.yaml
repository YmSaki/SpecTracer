claim: DA-003で、失敗として発散する構文の、実行されるかどうかを決める位置とは、その構文を支配する条件式、その構文を含む腕とそれより前の腕のガード式、およびそれらの腕のパターン（`if let` / `let ... else`ではそのパターン）のうち反駁可能な部分が検査するscrutineeの位置をいう。失敗として発散する構文への到達とは、決める位置のうち、その位置の値自体が派生である位置へ、値が派生として流れることをいう。
